function renderOTPScreen(){
  const user = state.otpUser;
  const isEnroll = state.otpStage === 'enroll';
  const safeUsername = user ? user.username.replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])) : '';
  let body = '';
  if(isEnroll){
    const issuer = 'Travel & Tours';
    const otpauthUri = 'otpauth://totp/' + encodeURIComponent(issuer) + ':' + encodeURIComponent(user.username) + '?secret=' + state.otpSecret + '&issuer=' + encodeURIComponent(issuer) + '&algorithm=SHA1&digits=6&period=30';
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=' + encodeURIComponent(otpauthUri);
    body = `
      <div class="otp-step">Scan this QR code with <b>Google Authenticator</b>, <b>Authy</b>, or any TOTP app.</div>
      <div class="otp-qr-wrap"><img src="${qrUrl}" alt="QR code could not be loaded. Check your internet connection and reload." /></div>
      <div class="otp-step" style="margin-top:14px;margin-bottom:6px;">Then enter the 6-digit code the app shows you:</div>
    `;
  } else {
    body = `<div class="otp-step">This account is already enrolled in two-factor authentication. Enter the current 6-digit code from Google Authenticator or the authenticator app set up for <b>${safeUsername}</b>.<br/><br/>Setting up a new phone? Use the option below to replace the authenticator and show a fresh QR code.</div>`;
  }
  return `
  <div class="login-screen">
    <div class="login-card">
      <div class="login-brand-mark">Travel &amp; Tours</div>
      <div class="login-brand-sub">${isEnroll ? 'Set up two-factor authentication' : 'Two-factor verification'}</div>
      ${state.otpError ? `<div class="login-error">${state.otpError}</div>` : ''}
      ${body}
      <form id="otp-form" autocomplete="off">
        <input id="otp-code" class="otp-input" name="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" required autofocus />
        <div class="otp-countdown">Code refreshes in <span id="otp-countdown">30</span>s</div>
        <button class="btn btn-primary login-submit" type="submit" ${state.otpBusy?'disabled':''}>${state.otpBusy ? 'Verifying…' : (isEnroll ? 'Verify & continue' : 'Verify')}</button>
      </form>
      <button type="button" class="otp-back" data-otp-back>← Back to sign in</button>
      <button type="button" class="otp-reset-link" data-otp-reset>Reset 2FA QR code</button>
    </div>
  </div>`;
}

function header(eyebrow, title){
  const user = currentUser();
  const unread = user ? unreadNotificationsFor(user).length : 0;
  const showLeaveTools = canDecideLeave() && (title==='Leave Management' || title==='Recently Deleted');
  const deletedCount = state.deletedLeaveRequests.length;
  return `
  <div class="topline">
    <div>
      <div class="eyebrow">${eyebrow}</div>
      <h1>${title}</h1>
    </div>
    <div class="topline-right">
      ${showLeaveTools ? `<div class="leave-tools">
        ${!state.leaveTrashOpen ? `<button class="leave-tool-btn leave-tool-icon ${state.leaveDeleteMode?'primary':''}" data-leave-delete-mode aria-label="${state.leaveDeleteMode?'Delete selected leave requests':'Select leave requests to delete'}" title="${state.leaveDeleteMode?`Delete selected${state.selectedLeaveIds.length?` (${state.selectedLeaveIds.length})`:''}`:'Delete'}" ${state.leaveDeleteMode && !state.selectedLeaveIds.length?'disabled':''}><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 5.5h13M8 5.5V3.8h4v1.7m-6.5 0 .7 10.7c.05.8.7 1.3 1.4 1.3h4.8c.7 0 1.35-.5 1.4-1.3l.7-10.7M8.2 8.5v5.5m3.6-5.5v5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>${state.leaveDeleteMode && state.selectedLeaveIds.length?`<span class="leave-tool-count">${state.selectedLeaveIds.length}</span>`:''}</button>` : ''}
        ${state.leaveDeleteMode && !state.leaveTrashOpen ? `<button class="leave-tool-btn" data-leave-delete-cancel>Cancel</button>` : ''}
        <button class="leave-tool-btn leave-tool-icon" data-leave-trash-toggle aria-label="${state.leaveTrashOpen?'Back to requests':'Recently deleted'}" title="${state.leaveTrashOpen?'Back to requests':'Recently deleted'}"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true">${state.leaveTrashOpen?'<path d="M12.5 4.5 7 10l5.5 5.5M7.5 10h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>':'<path d="M10 6v4l2.5 1.5M4.4 7A6.5 6.5 0 1 1 3.5 11M4.5 3.8v3.5H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'}</svg>${deletedCount?`<span class="leave-tool-count">${deletedCount>99?'99+':deletedCount}</span>`:''}</button>
      </div>` : ''}
      <button class="notif-bell ${unread>0?'has-unread':''}" data-notif-toggle aria-label="Notifications" aria-expanded="${state.notifOpen?'true':'false'}">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 3C7.24 3 5 5.24 5 8V12L4 14H16L15 12V8C15 5.24 12.76 3 10 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M8 15C8 16.1 8.9 17 10 17C11.1 17 12 16.1 12 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        ${unread>0 ? `<span class="notif-badge">${unread>9?'9+':unread}</span>` : ''}
      </button>
      <div class="today">${new Date().toLocaleDateString('en-US',{weekday:'long', year:'numeric', month:'long', day:'numeric'})}</div>
      ${state.notifOpen ? renderNotificationPanel() : ''}
    </div>
  </div>`;
}
function renderNotificationPanel(){
  const user = currentUser();
  if(!user) return '';
  const list = notificationsFor(user).slice(0, 20);
  const hasUnread = list.some(n => !n.read);
  return `
  <div class="notif-panel" data-notif-panel>
    <div class="notif-panel-head">
      <span class="notif-panel-title">Notifications</span>
      ${hasUnread ? `<button class="notif-clear-btn" data-notif-clear>Mark all read</button>` : ''}
    </div>
    <div class="notif-list">
      ${list.length ? list.map(n => `
        <div class="notif-item ${n.read?'':'unread'} notif-${n.tone}">
          <div class="notif-item-icon">${notifIconSvg(n.tone)}</div>
          <div class="notif-item-body">
            <div class="notif-item-title">${n.title}</div>
            <div class="notif-item-message">${n.message}</div>
            <div class="notif-item-time">${formatRelativeTime(n.createdAt)}</div>
          </div>
        </div>
      `).join('') : `<div class="notif-empty">No notifications yet.</div>`}
    </div>
  </div>`;
}

function renderDashboard(){
  const u = currentUser();
  const emps = visibleEmployees();
  const empIds = new Set(emps.map(e=>e.id));
  const onShiftToday = state.shifts.filter(s=>s.date===todayISO && empIds.has(s.employeeId)).length;
  const pendingLeave = state.leaveRequests.filter(l=>l.status==='Pending' && empIds.has(l.employeeId)).length;
  const ts = computeTimesheet(state.weekStart, emps);
  const weekHours = ts.reduce((a,r)=>a+r.total,0).toFixed(1);
  const lateThisWeek = ts.reduce((a,r)=>a+r.lateCount,0);
  const absentThisWeek = ts.reduce((a,r)=>a+r.absentCount,0);
  const upcomingLeave = state.leaveRequests.filter(l=>l.status!=='Denied' && empIds.has(l.employeeId)).slice(-4).reverse();
  const rosterLabel = u.role==='Employee' ? 'Your profile' : 'Employees on the roster';
  const overtimeThisWeek = ts.reduce((a,r)=>a+r.overtime,0).toFixed(1);
  return `
  ${header('Overview', 'Today at a glance')}
  <div class="board">
    <div class="board-tile"><div class="board-label">${rosterLabel}</div><div class="board-value ${u.role==='Employee'?'small':''}">${u.role==='Employee' ? empName(u.employeeId) : state.employees.length}</div></div>
    <div class="board-tile"><div class="board-label">On shift today</div><div class="board-value teal">${onShiftToday}</div></div>
    <div class="board-tile"><div class="board-label">Pending leave requests</div><div class="board-value">${pendingLeave}</div></div>
    <div class="board-tile"><div class="board-label">Hours logged this week</div><div class="board-value teal">${weekHours}</div></div>
    <div class="board-tile"><div class="board-label">Late / absent this week</div><div class="board-value small">${lateThisWeek} late · ${absentThisWeek} absent</div></div>
    <div class="board-tile"><div class="board-label">Overtime hours this week</div><div class="board-value small">${overtimeThisWeek}h</div></div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="section-title">Today's schedule</div>
      ${renderTodaySchedule(empIds)}
    </div>
    <div class="card">
      <div class="section-title">Recent leave activity</div>
      ${upcomingLeave.length ? upcomingLeave.map(l=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bg-2);">
          <div>
            <div style="font-weight:600;font-size:13px;">${empName(l.employeeId)}</div>
            <div style="font-size:11.5px;color:var(--text-soft);">${fmtDate(l.startDate)} – ${fmtDate(l.endDate)} · ${l.type}</div>
          </div>
          ${leaveStatusBadge(l.status)}
        </div>
      `).join('') : '<div class="empty">No leave activity yet.</div>'}
      <div class="note">Approving a leave request here automatically updates the Schedule and Attendance views for the affected dates.</div>
    </div>
  </div>
  ${renderUpcomingScheduleCard(empIds)}`;
}
function dashboardTodayShifts(empIds){ return shiftsOn(todayISO).filter(s=>empIds.has(s.employeeId)); }
function dashboardNextScheduledDay(empIds){
  for(let i=1;i<=14;i++){
    const d = addDays(todayISO, i);
    const rows = shiftsOn(d).filter(s=>empIds.has(s.employeeId));
    if(rows.length > 0) return { date: d, rows };
  }
  return null;
}
function renderScheduleTable(rows, date, isToday){
  if(!rows.length) return `<div class="empty">No shifts scheduled ${isToday ? 'today' : 'on this day'}.</div>`;
  const defaultStatus = isToday ? 'On Shift' : 'Scheduled';
  return `
  <table>
    <thead><tr><th>Employee</th><th>Assignment</th><th>Shift</th><th>Status</th></tr></thead>
    <tbody>
      ${rows.map(s=>{
        const att = attendanceFor(s.employeeId, date);
        const onLeave = isOnApprovedLeave(s.employeeId, date);
        const status = onLeave ? 'On Leave' : (att ? att.status : defaultStatus);
        return `<tr><td>${empName(s.employeeId)}</td><td>${s.tour}</td><td class="mono">${s.start}–${s.end}</td><td>${statusBadge(status)}</td></tr>`;
      }).join('')}
    </tbody>
  </table>`;
}
function renderTodaySchedule(empIds){ return renderScheduleTable(dashboardTodayShifts(empIds), todayISO, true); }
function renderUpcomingScheduleCard(empIds){
  const next = dashboardNextScheduledDay(empIds);
  if(!next) return '';
  return `
  <div class="card">
    <div class="section-title">Upcoming schedule — ${fmtDate(next.date)}</div>
    ${renderScheduleTable(next.rows, next.date, false)}
    <div class="note">This is the next scheduled day after today.</div>
  </div>`;
}

function renderLeaveAttachment(attachment){
  if(!attachment || !attachment.data) return '';
  const name = escapeHtml(attachment.name || 'attachment');
  const data = escapeHtml(attachment.data);
  const mime = attachment.type || (String(attachment.data).match(/^data:([^;,]+)/i)||[])[1] || '';
  const extension = (attachment.name||'').split('.').pop().toLowerCase();
  const imageMime = /^image\/(png|jpe?g|gif|webp|bmp|avif)$/i.test(mime);
  const imageExtension = ['png','jpg','jpeg','gif','webp','bmp','avif'].includes(extension);
  if(imageMime || (!mime && imageExtension)) return `<div class="leave-attachment"><span class="leave-attachment-label">Attached image</span><a class="leave-attachment-preview" href="${data}" target="_blank" rel="noopener" aria-label="Open ${name}"><img src="${data}" alt="Attached image: ${name}" loading="lazy"></a><a class="leave-attachment-link" href="${data}" target="_blank" rel="noopener">Open full image</a></div>`;

}

function moveLeaveRequestsToTrash(ids){
  if(!canDecideLeave()) return 0;
  const idSet = new Set(ids);
  const now = Date.now();
  const moved = state.leaveRequests.filter(request=>idSet.has(request.id));
  if(!moved.length) return 0;
  state.deletedLeaveRequests.unshift(...moved.map(request=>({...request, deletedAt:now, deletedBy:currentUser()?.name||'Manager'})));
  state.leaveRequests = state.leaveRequests.filter(request=>!idSet.has(request.id));
  state.selectedLeaveIds = [];
  state.leaveDeleteMode = false;
  persistState();
  render();
  return moved.length;
}
function restoreLeaveRequest(id){
  if(!canDecideLeave()) return;
  const request = state.deletedLeaveRequests.find(item=>item.id===id);
  if(!request) return;
  const restored = {...request};
  delete restored.deletedAt;
  delete restored.deletedBy;
  state.deletedLeaveRequests = state.deletedLeaveRequests.filter(item=>item.id!==id);
  state.leaveRequests.push(restored);
  persistState();
  render();
}

/* ---------- Analytics ---------- */
function fmtDateShort(iso){ const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
const ANALYTICS_OT_MULTIPLIER = 1.25;
function weeklyAttendanceRate(weekStart, emps){
  const dates = weekDates(weekStart);
  const ids = empIdsOf(emps);
  const scheduled = state.shifts.filter(s=>ids.has(s.employeeId) && dates.includes(s.date)).length;
  const present = state.attendance.filter(a=>ids.has(a.employeeId) && dates.includes(a.date) && (a.status==='Present'||a.status==='Late')).length;
  return scheduled ? Math.round((present/scheduled)*100) : null;
}
function attendanceTrend(weekStart, emps, weeks){
  const out = [];
  for(let i=weeks-1;i>=0;i--){ const ws = addDays(weekStart, -7*i); out.push({weekStart: ws, rate: weeklyAttendanceRate(ws, emps)}); }
  return out;
}
function analyticsReportRows(weekStart, emps){
  const dates = weekDates(weekStart);
  const ts = computeTimesheet(weekStart, emps);
  return emps.map(emp=>{
    const row = ts.find(r=>r.emp.id===emp.id);
    const scheduled = state.shifts.filter(s=>s.employeeId===emp.id && dates.includes(s.date)).length;
    const attendanceRows = dates.map(d=>attendanceFor(emp.id, d));
    const present = attendanceRows.filter(a=>a && a.status==='Present').length;
    const late = attendanceRows.filter(a=>a && a.status==='Late').length;
    const absent = attendanceRows.filter(a=>a && a.status==='Absent').length;
    const leaveDays = dates.filter(d=>isOnApprovedLeave(emp.id, d)).length;
    const attendanceRate = scheduled ? Math.round(((present+late)/scheduled)*100) : null;
    const rate = Number(emp.hourlyRate) || 0;
    const regularPortion = Math.min(row.regular, 40);
    const estCost = round2(regularPortion*rate + row.overtime*rate*ANALYTICS_OT_MULTIPLIER);
    return {emp, scheduled, present, late, absent, leaveDays, hours:row.total, overtime:row.overtime, attendanceRate, estCost};
  });
}

function empIdsOf(emps){ return new Set(emps.map(e=>e.id)); }
function dayCount(startDate,endDate){ const ms = new Date(endDate+'T00:00:00') - new Date(startDate+'T00:00:00'); return Math.max(0, Math.round(ms / 86400000) + 1); }
function estPeso(n){ return '₱' + Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function roleBadge(role){ const map = {Admin:'role-admin', Manager:'role-manager', Employee:'role-employee'}; return `<span class="role-badge ${map[role]||'role-employee'}">${role}</span>`; }

function attachLoginHandlers(){
  const form = document.getElementById('login-form');
  const toggle = document.querySelector('[data-toggle-pw]');
  const loginScreen = document.querySelector('.login-screen');
  const loginCard = document.querySelector('.login-card');
  const airplaneCursor = document.querySelector('.login-airplane-cursor');
  const trailCanvas = document.getElementById('login-flight-trail');
  const trailCtx = trailCanvas ? trailCanvas.getContext('2d') : null;
  let lastPointerX = null, lastPointerY = null, trailPoints = [], trailFrame = 0, trailBreakPending = true;
  if(trailCanvas && trailCtx){
    const resizeTrail = ()=>{
      const ratio=Math.min(window.devicePixelRatio||1,2);
      trailCanvas.width=Math.round(window.innerWidth*ratio);
      trailCanvas.height=Math.round(window.innerHeight*ratio);
      trailCtx.setTransform(ratio,0,0,ratio,0,0);
    };
    resizeTrail();
    window.addEventListener('resize',resizeTrail);
    const drawTrail = ()=>{
      const now=performance.now();
      const lifetime=850;
      trailCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
      trailPoints=trailPoints.filter(point=>now-point.time<lifetime);
      for(let i=1;i<trailPoints.length;i++){
        const previous=trailPoints[i-1], point=trailPoints[i];
        if(point.breakBefore) continue;
        const alpha=Math.max(0,1-(now-point.time)/lifetime);
        if(alpha<=0) continue;
        const dx=point.x-previous.x, dy=point.y-previous.y, distance=Math.hypot(dx,dy);
        if(distance<.5) continue;
        const normalX=-dy/distance, normalY=dx/distance, wingGap=12;
        trailCtx.lineCap='round';
        trailCtx.lineJoin='round';
        for(const side of [-1,1]){
          const offsetX=normalX*wingGap*side, offsetY=normalY*wingGap*side;
          trailCtx.beginPath();
          trailCtx.moveTo(previous.x+offsetX,previous.y+offsetY);
          trailCtx.lineTo(point.x+offsetX,point.y+offsetY);
          trailCtx.strokeStyle=`rgba(255,255,255,${alpha*.5})`;
          trailCtx.lineWidth=6*alpha;
          trailCtx.shadowColor=`rgba(255,255,255,${alpha})`;
          trailCtx.shadowBlur=14*alpha;
          trailCtx.stroke();
          trailCtx.beginPath();
          trailCtx.moveTo(previous.x+offsetX,previous.y+offsetY);
          trailCtx.lineTo(point.x+offsetX,point.y+offsetY);
          trailCtx.strokeStyle=`rgba(255,255,255,${alpha})`;
          trailCtx.lineWidth=1.8*alpha;
          trailCtx.shadowBlur=4*alpha;
          trailCtx.stroke();
        }
      }
      if(trailPoints.length){ trailFrame=requestAnimationFrame(drawTrail); }
      else { trailFrame=0; trailCtx.clearRect(0,0,window.innerWidth,window.innerHeight); }
    };
    loginScreen.addEventListener('pointermove',e=>{
      if(e.pointerType==='touch' || !loginCard || loginCard.contains(e.target)){
        trailBreakPending=true;
        return;
      }
      trailPoints.push({x:e.clientX,y:e.clientY,time:performance.now(),breakBefore:trailBreakPending});
      trailBreakPending=false;
      if(!trailFrame) trailFrame=requestAnimationFrame(drawTrail);
    });
    loginScreen.addEventListener('pointerleave',()=>{ trailBreakPending=true; });
  }
  if(loginScreen && loginCard && airplaneCursor){
    loginScreen.addEventListener('pointermove', e=>{
      if(e.pointerType==='touch') return;
      if(loginCard.contains(e.target)){
        airplaneCursor.classList.remove('visible');
        lastPointerX = null; lastPointerY = null;
        return;
      }
      if(lastPointerX!==null && lastPointerY!==null){
        const dx=e.clientX-lastPointerX, dy=e.clientY-lastPointerY;
        if(Math.hypot(dx,dy)>1){
          const angle=Math.atan2(dy,dx)*180/Math.PI+90;
          airplaneCursor.style.setProperty('--plane-angle',angle+'deg');
        }
      }
      lastPointerX=e.clientX; lastPointerY=e.clientY;
      airplaneCursor.style.left = e.clientX + 'px';
      airplaneCursor.style.top = e.clientY + 'px';
      airplaneCursor.classList.add('visible');
    });
    loginScreen.addEventListener('pointerleave', ()=>{
      airplaneCursor.classList.remove('visible');
      lastPointerX = null; lastPointerY = null;
    });
    loginScreen.addEventListener('pointerdown', e=>{
      if(loginCard.contains(e.target)) return;
      airplaneCursor.classList.add('clicking');
      setTimeout(()=>airplaneCursor.classList.remove('clicking'),120);
    });
  }
  if(toggle) toggle.addEventListener('click', ()=>{
    const input=document.getElementById('login-password');
    if(!input) return;
    const showing=input.type==='password';
    input.type=showing?'text':'password';
    state.showLoginPw=showing;
    toggle.setAttribute('aria-label',showing?'Hide password':'Show password');
    toggle.setAttribute('title',showing?'Hide password':'Show password');
    toggle.setAttribute('aria-pressed',showing?'true':'false');
    toggle.innerHTML=passwordEyeIcon(showing);
    toggle.classList.remove('clicked');
    void toggle.offsetWidth;
    toggle.classList.add('clicked');
    input.focus();
  });
  if(form) form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(state.loginError && state.loginError.lockedUntil) return;
    const fd = new FormData(form);
    const username = (fd.get('username')||'').trim();
    const password = fd.get('password')||'';
    state.loginBusy = true; state.loginError = null; render();
    let result;
    try{ result = await attemptLogin(username, password); }
    catch(err){ state.loginBusy = false; state.loginError = {message:'Sign-in failed: ' + (err.message||'unknown error')}; render(); return; }
    persistState();
    state.loginBusy = false;
    if(!result.ok){
      const failures = recordLoginFailure(result.lockedUntil || null);
      state.loginError = failures.lockedUntil
        ? {message:'Too many failed attempts. Please wait before trying again.', locked:true, lockedUntil:failures.lockedUntil}
        : { message: result.error, locked: !!result.locked || /locked/i.test(result.error), lockedUntil: null };
      render();
      return;
    }
    clearLoginFailureState();
    state.otpUser = result.user;
    state.otpError = null; state.otpBusy = false; state.otpAttempts = 0; state.loginError = null;
    if(result.stage === 'verify'){ state.otpStage = 'verify'; state.otpSecret = null; }
    else { state.otpStage = 'enroll'; state.otpSecret = generateTotpSecret(); }
    render();
  });
}
function attachOTPHandlers(){
  const form = document.getElementById('otp-form');
  const back = document.querySelector('[data-otp-back]');
  if(back) back.addEventListener('click', ()=>{ cancelOTP(); render(); });
  const resetLink = document.querySelector('[data-otp-reset]');
  if(resetLink) resetLink.addEventListener('click', ()=>{
    if(!confirm('Reset the 2FA QR code for this account?\n\nThe current authenticator entry will stop working. Scan the new QR code and verify it to finish setup.')) return;
    const user = state.otpUser;
    if(!user) return;
    user.totpSecret = null; user.totpLastCounter = null; user.totpEnrolledAt = null;
    persistState();
    state.otpStage = 'enroll';
    state.otpSecret = generateTotpSecret();
    state.otpError = null; state.otpAttempts = 0;
    render();
  });
  if(form) form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(state.otpBusy) return;
    const input = document.getElementById('otp-code');
    const code = (input && input.value || '').trim();
    if(!code) return;
    state.otpBusy = true; state.otpError = null; render();
    let verdict;
    try{
      if(state.otpStage === 'enroll'){
        verdict = await verifyTotp(state.otpSecret, code);
        if(!verdict.ok){
          state.otpBusy = false; state.otpAttempts++;
          if(state.otpAttempts >= OTP_MAX_ATTEMPTS){ cancelOTP(); state.loginError = {message:'Too many incorrect codes. Please sign in again.'}; }
          else { state.otpError = verdict.reason; }
          render(); return;
        }
        const user = state.otpUser;
        user.totpSecret = state.otpSecret; user.totpLastCounter = verdict.counter; user.totpEnrolledAt = Date.now();
        completeLogin(user); render(); return;
      }
      verdict = await verifyTotp(state.otpUser.totpSecret, code);
      if(!verdict.ok){
        state.otpBusy = false; state.otpAttempts++;
        if(state.otpAttempts >= OTP_MAX_ATTEMPTS){ cancelOTP(); state.loginError = {message:'Too many incorrect codes. Please sign in again.'}; }
        else { state.otpError = verdict.reason; }
        render(); return;
      }
      if(state.otpUser.totpLastCounter !== null && verdict.counter <= state.otpUser.totpLastCounter){
        state.otpBusy = false; state.otpError = 'That code has already been used. Wait for the next one.'; render(); return;
      }
      state.otpUser.totpLastCounter = verdict.counter;
      completeLogin(state.otpUser); render();
    }catch(err){ state.otpBusy = false; state.otpError = err.message || 'Verification failed.'; render(); }
  });
}

    });
  });
  document.querySelectorAll('[data-leave-deny]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!canDecideLeave()) return;
      const l = state.leaveRequests.find(x=>x.id===el.dataset.leaveDeny);
      l.status = 'Denied';
      pushNotification({employeeId: l.employeeId}, 'Leave denied', `Your ${l.type} leave from ${fmtDate(l.startDate)} to ${fmtDate(l.endDate)} has been denied.`, {tone:'danger'});
      persistState(); render();
    });
  });
  const accountForm = document.getElementById('account-form');
  if(accountForm) accountForm.addEventListener('submit', async e=>{
    e.preventDefault();
    if(!canManageAccounts()) return;
    const fd = new FormData(accountForm);
    const username = (fd.get('username')||'').trim();
    if(!username){ return; }
    if(findUserByUsername(username)){ alert('That username is already taken.'); return; }
    const tempPw = genTempPassword();
    const salt = randomHex(16);
    const hash = await hashPassword(tempPw, salt);
    state.users.push({
      id: uid('u'), username, name: fd.get('name'), role: fd.get('role'),
      employeeId: fd.get('employeeId') || null, salt, hash,
      failedAttempts:0, lockedUntil:null, active:true, mustChangePassword:true, lastLogin:null,
      totpSecret:null, totpLastCounter:null, totpEnrolledAt:null
    });
    persistState(); render();
    alert(`Account created for ${username}.\n\nTemporary password (share securely, shown only once):\n${tempPw}\n\nThe user must change it on first sign-in, then enroll in two-factor authentication.`);
  });
  document.querySelectorAll('[data-toggle-active]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!canManageAccounts()) return;
      const user = state.users.find(x=>x.id===el.dataset.toggleActive);
      if(user.id === state.session.userId && user.active){ alert("You can't deactivate the account you're currently signed in with."); return; }
      user.active = !user.active;
      persistState(); render();
    });
  });
  document.querySelectorAll('[data-reset-pw]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!canManageAccounts()) return;
      const user = state.users.find(x=>x.id===el.dataset.resetPw);
      if(user.id === state.session.userId) return;
      const tempPw = genTempPassword();
      user.salt = randomHex(16);
      user.hash = await hashPassword(tempPw, user.salt);
      user.mustChangePassword = true;
      user.failedAttempts = 0;
      user.lockedUntil = null;
      persistState(); render();
      alert(`Password reset for ${user.username}.\n\nTemporary password (share securely, shown only once):\n${tempPw}`);
    });
  });
  document.querySelectorAll('[data-reset-totp]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!canManageAccounts()) return;
      const user = state.users.find(x=>x.id===el.dataset.resetTotp);
      if(!user) return;
      if(!confirm(`Reset two-factor for ${user.username}?`)) return;
      user.totpSecret = null; user.totpLastCounter = null; user.totpEnrolledAt = null;
      persistState(); render();
      alert(`Two-factor reset for ${user.username}.`);
    });
  });
  document.querySelectorAll('[data-unlock]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!canManageAccounts()) return;
      const user = state.users.find(x=>x.id===el.dataset.unlock);
      user.lockedUntil = null;
      user.failedAttempts = 0;
      persistState(); render();
    });
  });
  const newPwInput = document.getElementById('new-pw');
  if(newPwInput) newPwInput.addEventListener('input', ()=>{
    const strength = passwordStrength(newPwInput.value);
    const bars = document.querySelectorAll('#strength-row .strength-bar');
    const cls = strength===1?'on-weak':strength===2?'on-fair':strength===3?'on-strong':'';
    bars.forEach((b,i)=>{ b.className = 'strength-bar' + (i < strength && cls ? ' '+cls : ''); });
  });
  document.querySelectorAll('[data-password-toggle]').forEach(toggle=>toggle.addEventListener('click', ()=>{
    const fieldName=toggle.dataset.passwordToggle;
    const input=document.querySelector(`#password-form input[name="${fieldName}"]`);
    if(!input) return;
    const showing=input.type==='password';
    input.type=showing?'text':'password';
    toggle.setAttribute('aria-pressed',showing?'true':'false');
    toggle.setAttribute('aria-label',`${showing?'Hide':'Show'} ${fieldName==='current'?'current password':fieldName==='next'?'new password':'confirmation password'}`);
    toggle.innerHTML=passwordEyeIcon(showing);
    input.focus();
  }));
  const passwordForm = document.getElementById('password-form');
  if(passwordForm) passwordForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(passwordForm);
    const current = fd.get('current'), next = fd.get('next'), confirm2 = fd.get('confirm');
    const user = currentUser();
    state.accountError = null; state.accountSuccess = null;
    const currentHash = await hashPassword(current, user.salt);
    if(currentHash !== user.hash){ state.accountError = 'Current password is incorrect.'; render(); return; }
    if(next !== confirm2){ state.accountError = 'New password and confirmation do not match.'; render(); return; }
    const policyErrs = passwordPolicyErrors(next);
    if(policyErrs.length){ state.accountError = 'Password needs ' + policyErrs.join(', ') + '.'; render(); return; }
    if(next === current){ state.accountError = 'New password must be different from the current password.'; render(); return; }
    user.salt = randomHex(16);
    user.hash = await hashPassword(next, user.salt);
    user.mustChangePassword = false;
    state.accountSuccess = 'Password updated successfully.';
    persistState(); render();
  });
}
function addMinutesToTime(time, mins){
  const [h,m] = time.split(':').map(Number);
  const d = new Date(2000,0,1,h,m+mins);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

document.addEventListener('click', (e) => {
  let dirty = false;
  if(state.openAttKey && !e.target.closest('.att-wrap')){ closeAllAttMenus(); dirty = true; }
  if(state.notifOpen && !e.target.closest('.notif-bell') && !e.target.closest('[data-notif-panel]')){ state.notifOpen = false; dirty = true; }
  if(!e.target.closest('.lf-select') && !e.target.closest('.lf-date')){ lfCloseAll(); }
  if(dirty) render();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    let dirty = false;
    if(state.openAttKey){
      const key = state.openAttKey;
      closeAllAttMenus();
      const t = document.querySelector('.att-trigger[data-att-trigger="' + key + '"]');
      if(t) t.focus();
      dirty = true;
    }
    if(state.notifOpen){ state.notifOpen = false; dirty = true; }
    if(state.addShiftModal){ state.addShiftModal = null; dirty = true; }
    lfCloseAll();
    if(dirty) render();
  }
});

render();
startIdleWatch();
seedUsers();
</script>
