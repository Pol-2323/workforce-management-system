<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Travel & Tours — Workforce Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2F80ED; --primary-deep:#1E5FBF; --primary-soft:#EAF2FE;
    --secondary:#56CCF2; --secondary-deep:#2D9CDB;
    --accent:#27AE60; --accent-deep:#1E8A4A; --accent-soft:#E8F6ED;
    --bg:#F8FAFC; --bg-2:#F1F5F9;
    --card:#FFFFFF; --border:#EEF2F7; --border-strong:#DDE5EE;
    --text:#1F2937; --text-soft:#6B7280;
    --rail:#0F172A; --rail-2:#1E293B; --rail-3:#334155;
    --rail-line:#1E293B; --rail-text:#CBD5E1; --rail-text-soft:#94A3B8; --rail-text-dim:#64748B;
    --ink:var(--rail); --panel:var(--rail-2); --panel-2:var(--rail-3);
    --paper:var(--bg); --paper-2:var(--bg-2);
    --amber:var(--primary); --amber-deep:var(--primary-deep);
    --teal:var(--accent); --teal-deep:var(--accent-deep);
    --rust:#EB5757; --line:var(--border); --line-dark:var(--rail-line);
    --present:#27AE60; --present-deep:#1E8A4A; --present-bg:#E8F6ED;
    --late:#F2994A;    --late-deep:#B26A15;    --late-bg:#FDF2E5;
    --absent:#EB5757;  --absent-deep:#B33A3A;  --absent-bg:#FDECEC;
    --leave:#2D9CDB;   --leave-deep:#1E6FA8;   --leave-bg:#E7F6FD;
    --scheduled:#8B5CF6; --scheduled-deep:#6D3FE0; --scheduled-bg:#F0EBFE;
    --nostatus-bg:#F1F4F8; --nostatus-deep:#6B7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;font-weight:400;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  .app{display:flex;min-height:100vh;}
  .rail{width:240px;flex-shrink:0;background:var(--primary);color:#FFFFFF;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{padding:26px 22px 20px 22px;border-bottom:1px solid rgba(255,255,255,.2);}
  .brand-mark{font-family:'Poppins',sans-serif;font-size:21px;font-weight:600;letter-spacing:-0.2px;color:#FFFFFF;}
  .brand-sub{font-size:11.5px;color:rgba(255,255,255,.78);margin-top:4px;letter-spacing:0.3px;}
  .nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:6px;color:rgba(255,255,255,.9);cursor:pointer;font-size:14px;font-weight:500;border:none;background:transparent;text-align:left;width:100%;font-family:inherit;transition:background .15s ease,color .15s ease;}
  .nav-item:hover{background:rgba(255,255,255,.14);color:#FFFFFF;}
  .nav-item.active{background:rgba(255,255,255,.23);color:#FFFFFF;}
  .nav-item.active .nav-dot{background:#FFFFFF;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);flex-shrink:0;}
  .nav-count{margin-left:auto;font-family:'Poppins',sans-serif;font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums;font-size:11px;color:#FFFFFF;background:rgba(255,255,255,.16);padding:2px 6px;border-radius:3px;}
  .rail-foot{padding:16px 22px;border-top:1px solid rgba(255,255,255,.2);font-size:11.5px;color:rgba(255,255,255,.72);line-height:1.5;}
  .main{flex:1;min-width:0;padding:34px 40px 60px 40px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;gap:20px;flex-wrap:wrap;position:relative;z-index:50;}
  .topline-right{display:flex;align-items:center;gap:14px;position:relative;}
  .eyebrow{font-size:12.5px;color:var(--text-soft);margin-bottom:6px;font-weight:500;}
  h1{font-family:'Poppins',sans-serif;font-weight:600;font-size:30px;margin:0;color:var(--text);letter-spacing:-0.5px;}
  .today{font-family:'Poppins',sans-serif;font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--text-soft);text-align:right;}
  .board{background:var(--primary);border-radius:12px;padding:22px 26px;display:flex;gap:0;margin-bottom:30px;overflow-x:auto;}
  .board-tile{flex:1;min-width:150px;padding:0 26px;border-right:1px solid rgba(255,255,255,.22);}
  .board-tile:last-child{border-right:none;}
  .board-tile:first-child{padding-left:0;}
  .board-label{font-size:11.5px;color:rgba(255,255,255,.82);letter-spacing:0.2px;margin-bottom:8px;}
  .board-value{font-family:'Poppins',sans-serif;font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;color:var(--secondary);line-height:1;letter-spacing:-0.5px;}
  .board-value.teal{color:#6EE7B7;}
  .board-value.small{font-size:18px;color:#FFFFFF;font-weight:500;letter-spacing:0;}
  .section-title{font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;margin:0 0 14px 0;letter-spacing:-0.2px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:22px;}
  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;}
  @media(max-width:980px){.grid-2{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;color:var(--text-soft);font-weight:600;padding:0 10px 10px 0;border-bottom:1px solid var(--border);}
  td{padding:11px 10px 11px 0;border-bottom:1px solid var(--bg-2);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:'Poppins',sans-serif;font-feature-settings:'tnum' 1, 'lnum' 1;font-variant-numeric:tabular-nums;font-size:13px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:500;}
  .badge-present{background:var(--present-bg);color:var(--present-deep);}
  .badge-late{background:var(--late-bg);color:var(--late-deep);}
  .badge-absent{background:var(--absent-bg);color:var(--absent-deep);}
  .badge-leave{background:var(--leave-bg);color:var(--leave-deep);}
  .badge-pending{background:var(--late-bg);color:var(--late-deep);}
  .badge-approved{background:var(--present-bg);color:var(--present-deep);}
  .badge-denied{background:var(--absent-bg);color:var(--absent-deep);}
  .badge-scheduled{background:var(--scheduled-bg);color:var(--scheduled-deep);}
  .badge-nostatus{background:var(--nostatus-bg);color:var(--nostatus-deep);}
  .badge-onshift{background:var(--primary-soft);color:var(--primary-deep);}
  .btn{font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;transition:opacity .12s ease;}
  button:not(:disabled),a[href],label[for],input[type="checkbox"]:not(:disabled),input[type="radio"]:not(:disabled),select:not(:disabled),summary{cursor:pointer;}
  .btn:hover{opacity:0.92;}
  .btn-primary{background:var(--primary);color:#FFFFFF;}
  .btn-amber{background:var(--primary);color:#FFFFFF;}
  .btn-teal{background:var(--accent);color:#FFFFFF;}
  .btn-rust{background:transparent;color:var(--rust);border-color:#F5C4C4;}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border-strong);}
  .btn-sm{padding:5px 11px;font-size:12px;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px;}
  .field label{font-size:12px;color:var(--text-soft);font-weight:600;}
  .field input,.field select,.field textarea{font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);color:var(--text);}
  .field textarea{resize:vertical;min-height:60px;}
  #leave-form .field-row{margin-bottom:16px;}
  #leave-attachment{width:100%;min-height:48px;padding:8px 10px;border:1px dashed #B8CBE2;border-radius:10px;background:linear-gradient(135deg,#F7FAFF,#F1F7FF);color:var(--text-soft);font-size:12px;cursor:pointer;}
  #leave-attachment:hover{border-color:var(--primary);background:var(--primary-soft);}
  #leave-attachment:focus-visible{outline:3px solid rgba(47,128,237,.18);outline-offset:2px;}
  #leave-attachment::file-selector-button{margin-right:12px;padding:8px 13px;border:0;border-radius:7px;background:var(--primary);color:#FFFFFF;font:600 12px 'Poppins',sans-serif;cursor:pointer;transition:background .18s ease,transform .18s ease;}
  #leave-attachment::file-selector-button:hover{background:var(--primary-deep);transform:translateY(-1px);}
  #leave-form .form-foot{margin-top:2px;}
  .form-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:4px;}
  .empty{text-align:center;padding:30px 10px;color:var(--text-soft);font-size:13.5px;}
  .ticket{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--card);}
  .ticket-main{flex:1;padding:16px 18px;}
  .ticket-stub{width:164px;flex-shrink:0;background:var(--bg-2);border-left:1px dashed var(--border-strong);padding:16px 12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;}
  .ticket-action-line{display:flex;align-items:center;justify-content:center;gap:5px;}
  .ticket-delete{width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;opacity:0;transform:translateX(-4px);transition:opacity .16s ease,transform .16s ease;padding:0;}
  .ticket-delete svg{width:15px;height:15px;display:block;}
  .ticket-delete-permanent{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .ticket-delete-permanent svg{width:16px;height:16px;display:block;}
  .ticket:hover .ticket-delete,.ticket:focus-within .ticket-delete{opacity:1;transform:translateX(0);}
  .ticket-select{accent-color:var(--primary);width:15px;height:15px;cursor:pointer;}
  .leave-tools{display:flex;align-items:center;gap:7px;}
  .leave-tool-btn{font:600 11.5px 'Poppins',sans-serif;color:var(--text-soft);background:var(--card);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;cursor:pointer;white-space:nowrap;transition:all .18s ease;}
  .leave-tool-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);}
  .leave-tool-btn:disabled{opacity:.45;cursor:not-allowed;}
  .leave-tool-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .leave-tool-icon{position:relative;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .leave-tool-icon svg{width:18px;height:18px;display:block;}
  .leave-tool-count{position:absolute;top:-5px;right:-5px;display:inline-flex;min-width:18px;height:18px;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg);border-radius:10px;background:var(--primary);color:#fff;font-size:9px;font-weight:700;}
  .ticket-name{font-weight:600;font-size:14.5px;margin-bottom:2px;}
  .ticket-meta{font-size:12px;color:var(--text-soft);}
  .ticket-reason{font-size:12.5px;color:var(--text-soft);margin-top:8px;font-style:italic;}
  .leave-attachment{margin-top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
  .leave-attachment-label{font-size:11.5px;color:var(--text-soft);font-weight:600;}
  .leave-attachment-preview{max-width:220px;max-height:160px;padding:4px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);display:block;overflow:hidden;}
  .leave-attachment-preview img{display:block;max-width:210px;max-height:150px;width:auto;height:auto;object-fit:contain;border-radius:5px;}
  .leave-attachment-link{font-size:12px;color:var(--primary-deep);font-weight:500;}
  .id-card{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:10px;}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;flex-shrink:0;}
  .id-name{font-weight:600;font-size:14px;}
  .id-role{font-size:12px;color:var(--text-soft);}
  .conflict-banner{background:var(--late-bg);border:1px solid #F5D6A8;color:#7A5417;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .note{font-size:12px;color:var(--text-soft);margin-top:8px;line-height:1.55;}
  .week-nav{display:flex;align-items:center;gap:10px;}
  .week-nav button{background:var(--bg-2);border:1px solid var(--border-strong);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;color:var(--text);font-family:inherit;}
  .sched-grid{display:grid;grid-template-columns:150px repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .sched-cell{background:var(--card);padding:10px;min-height:70px;}
  .sched-cell.drop-target{background:#EAF3FF;box-shadow:inset 0 0 0 2px rgba(47,128,237,.42);}
  .sched-head{background:var(--bg-2);font-size:11.5px;font-weight:600;color:var(--text-soft);padding:8px 10px;}
  .sched-emp{background:var(--bg-2);font-size:12.5px;font-weight:600;display:flex;align-items:center;padding:10px;}
  .shift-chip{background:var(--scheduled-bg);color:var(--scheduled-deep);border-radius:6px;padding:4px 7px;font-size:11px;margin-bottom:4px;font-family:'Poppins',sans-serif;font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:500;}
  .shift-chip[draggable="true"]{cursor:move;}
  .shift-chip[draggable="true"]:active,.shift-chip[draggable="true"].dragging{cursor:grabbing;opacity:.55;}
  .shift-chip.leave{background:var(--leave-bg);color:var(--leave-deep);}
  .shift-chip button{background:none;border:none;cursor:pointer;color:inherit;font-size:12px;padding:0;}
  .add-shift-btn{font-size:11px;color:var(--text-soft);background:none;border:1px dashed var(--border-strong);border-radius:6px;padding:4px 7px;cursor:pointer;width:100%;font-family:inherit;}
  .login-screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 500px at 15% -10%, #72B0FF 0%, transparent 60%),linear-gradient(135deg,var(--primary) 0%,var(--primary-deep) 100%);background-size:150% 150%,180% 180%;background-position:0% 0%,50% 50%;animation:loginBackgroundDrift 24s ease-in-out infinite alternate;padding:24px;}
  .login-flight-trail{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:999;}
  .login-screen .login-card{position:relative;z-index:1000;}
  .login-airplane-cursor{position:fixed;left:0;top:0;width:42px;height:42px;pointer-events:none;z-index:1001;opacity:0;transform:translate(-50%,-50%) rotate(var(--plane-angle,0deg)) scale(.55);transform-origin:center;transition:opacity .18s ease,transform .22s cubic-bezier(.16,1,.3,1),left .13s cubic-bezier(.22,1,.36,1),top .13s cubic-bezier(.22,1,.36,1);}
  .login-airplane-cursor img{position:relative;z-index:1;display:block;width:48px;height:48px;object-fit:contain;overflow:visible;filter:drop-shadow(0 0 4px #FFFFFF) drop-shadow(0 0 10px rgba(255,255,255,.85));}
  .login-airplane-cursor.visible{opacity:1;transform:translate(-50%,-50%) rotate(var(--plane-angle,0deg)) scale(1);}
  .login-airplane-cursor.clicking{transform:translate(-50%,-50%) rotate(var(--plane-angle,0deg)) scale(.84);}
  .login-card{width:100%;max-width:392px;background:var(--card);border-radius:16px;padding:34px 32px 32px 32px;box-shadow:0 24px 60px rgba(15,23,42,0.35);}
  .login-card-branded{position:relative;overflow:hidden;background:linear-gradient(to bottom,transparent 0 77px,var(--card) 77px);}
  .login-card-branded::before{content:"";position:absolute;inset:0 0 auto;height:77px;background:radial-gradient(ellipse at 18% 0%,rgba(255,255,255,.42),transparent 48%),linear-gradient(125deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 52%,rgba(255,255,255,.25));backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.62);box-shadow:inset 0 1px 0 rgba(255,255,255,.72),inset 0 -1px 0 rgba(255,255,255,.2);pointer-events:none;z-index:0;}
  .login-card-branded>*{position:relative;z-index:1;}
  .login-logo{display:block;width:86px;height:86px;object-fit:contain;margin:0 auto 14px;}
  .login-brand-mark{font-family:'Poppins',sans-serif;font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.3px;}
  .login-brand-sub{font-size:12.5px;color:var(--text-soft);margin-top:3px;margin-bottom:26px;}
  .login-label{font-size:12px;font-weight:600;color:var(--text-soft);display:block;margin-bottom:5px;transition:color .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .login-field:focus-within .login-label{color:var(--primary);transform:translateX(2px);}
  .login-field{margin-bottom:16px;}
  .login-input-wrap{position:relative;}
  .login-input-wrap input{width:100%;font-family:inherit;font-size:14px;padding:10px 40px 10px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--bg);color:var(--text);transition:border-color .22s ease,box-shadow .22s ease,background-color .22s ease;}
  .login-input-wrap input:focus{outline:none;border-color:var(--primary);background:#FFFFFF;box-shadow:0 0 0 3px rgba(47,128,237,.15);}
  .login-input-wrap input:focus-visible{outline:3px solid rgba(47,128,237,.38);outline-offset:2px;box-shadow:0 0 0 1px #FFFFFF,0 0 0 5px rgba(47,128,237,.2);}
  .login-input-wrap input[disabled]{background:var(--bg-2);color:var(--text-soft);cursor:not-allowed;}
  .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--primary);padding:6px 6px;font-family:inherit;}
  .login-eye-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:6px;border:0;border-radius:8px;background:transparent;color:var(--text-soft);cursor:pointer;transition:background .18s ease,color .18s ease,transform .18s ease;}
  .login-eye-toggle svg{width:19px;height:19px;display:block;transition:transform .18s cubic-bezier(.16,1,.3,1);}
  .login-eye-toggle:hover{background:var(--primary-soft);color:var(--primary);transform:translateY(-50%) scale(1.04);}
  .login-eye-toggle:hover svg{transform:scale(1.12);}
  .login-eye-toggle:active svg,.login-eye-toggle.clicked svg{animation:eyeTogglePop .32s cubic-bezier(.16,1,.3,1);}
  .login-eye-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
  .login-eye-toggle[disabled]{opacity:.5;cursor:not-allowed;}
  @keyframes eyeTogglePop{0%{transform:scale(.72) rotate(-8deg);opacity:.55;}65%{transform:scale(1.2) rotate(4deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
  .pw-toggle[disabled]{color:var(--text-soft);cursor:not-allowed;}
  .password-input-wrap{position:relative;width:100%;}
  .password-input-wrap input{width:100%;padding-right:44px !important;}
  .password-eye-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:28px;height:28px;padding:5px;border:0;border-radius:6px;background:transparent;color:var(--text-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .18s ease,background .18s ease,transform .18s ease;}
  .password-eye-toggle:hover{color:var(--primary);background:var(--primary-soft);transform:translateY(-50%) scale(1.06);}
  .password-eye-toggle:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
  .password-eye-toggle svg{width:18px;height:18px;display:block;}
  .login-submit{width:100%;padding:11px 16px;font-size:14px;margin-top:6px;border-radius:10px;}
  .login-screen #login-form .login-submit{display:flex;align-items:center;justify-content:center;gap:8px;background-image:linear-gradient(110deg,#2F80ED 0%,#2D9CDB 48%,#2F80ED 100%);background-size:220% 100%;transition:background-position .45s ease,transform .2s cubic-bezier(.16,1,.3,1),box-shadow .25s ease;}
  .login-screen #login-form .login-submit:hover:not(:disabled),.login-screen #login-form .login-submit:focus-visible{background-position:100% 0;transform:translateY(-2px);box-shadow:0 8px 16px rgba(17,73,145,.24);}
  .login-screen #login-form .login-submit:focus-visible{outline:3px solid #173F73;outline-offset:3px;}
  .login-submit-label{display:inline-block;}
  .login-submit-cursor{width:18px;height:18px;flex:none;opacity:0;transform:translateX(-6px) scale(.8) rotate(-10deg);transition:opacity .18s ease,transform .24s cubic-bezier(.16,1,.3,1);}
  .login-screen #login-form .login-submit:hover:not(:disabled) .login-submit-cursor,.login-screen #login-form .login-submit:focus-visible .login-submit-cursor{opacity:1;transform:translateX(0) scale(1) rotate(0);}
  .login-screen #login-form .login-submit:hover:not(:disabled) .login-submit-cursor{animation:loginCursorClick .55s cubic-bezier(.16,1,.3,1) .08s both;}
  .login-screen #login-form .login-submit:disabled .login-submit-cursor{display:none;}

  /* ============ NOTIFICATIONS ============ */
  .notif-bell{position:relative;width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-soft);transition:all .2s cubic-bezier(.16,1,.3,1);}

  .notif-item-icon{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .notif-item.notif-info .notif-item-icon{background:var(--leave-bg);color:var(--leave-deep);}
  .notif-item.notif-warning .notif-item-icon{background:var(--late-bg);color:var(--late-deep);}
  .notif-item.notif-success .notif-item-icon{background:var(--present-bg);color:var(--present-deep);}
  .notif-item.notif-danger .notif-item-icon{background:var(--absent-bg);color:var(--absent-deep);}
  .notif-item-icon svg{width:15px;height:15px;}
  .notif-item-body{flex:1;min-width:0;}
  .notif-item-title{font-weight:600;font-size:12.5px;margin-bottom:2px;}
  .notif-item-message{font-size:11.5px;color:var(--text-soft);line-height:1.45;}
  .notif-item-time{font-size:10.5px;color:var(--text-soft);margin-top:4px;}
  .notif-empty{padding:26px 16px;text-align:center;color:var(--text-soft);font-size:12.5px;}

  /* ============ TOASTS ============ */
  .toast-stack{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:500;pointer-events:none;max-width:calc(100vw - 40px);}
  .toast{pointer-events:auto;min-width:280px;max-width:380px;background:var(--card);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 14px 32px rgba(15,23,42,.14);padding:12px 14px;display:flex;gap:11px;align-items:flex-start;animation:toastIn .4s cubic-bezier(.16,1,.3,1) both;}
  .toast.leaving{animation:toastOut .35s ease-in forwards;}

  .toast.toast-info .toast-icon{background:var(--leave-bg);color:var(--leave-deep);}
  .toast.toast-warning .toast-icon{background:var(--late-bg);color:var(--late-deep);}
  .toast.toast-success .toast-icon{background:var(--present-bg);color:var(--present-deep);}
  .toast.toast-danger .toast-icon{background:var(--absent-bg);color:var(--absent-deep);}
  .toast-icon svg{width:16px;height:16px;}
  .toast-body{flex:1;min-width:0;}
  .toast-title{font-weight:600;font-size:13px;margin-bottom:2px;}

  .toast-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-soft);padding:0 2px;line-height:1;transition:color .15s ease, transform .18s ease;}
  .toast-close:hover{color:var(--text);transform:scale(1.15);}

  /* ============ SAVE FAB ============ */
  .save-fab{position:fixed;right:32px;bottom:32px;display:inline-flex;align-items:center;gap:10px;padding:13px 22px 13px 18px;border:none;border-radius:999px;background:linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);color:#FFFFFF;font-family:'Poppins', sans-serif;font-size:14px;font-weight:600;letter-spacing:0.1px;cursor:pointer;z-index:300;box-shadow:0 14px 30px rgba(47,128,237,.35), 0 4px 10px rgba(47,128,237,.2);transition:transform .22s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, background .3s ease;animation:saveFabIn .55s cubic-bezier(.16,1,.3,1) both;}
  .save-fab::after{content:"";position:absolute;inset:-4px;border-radius:inherit;background:radial-gradient(circle at 50% 50%, rgba(47,128,237,.35) 0%, transparent 70%);opacity:0;pointer-events:none;transition:opacity .3s ease;}
  .save-fab:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 20px 40px rgba(47,128,237,.42), 0 8px 16px rgba(47,128,237,.22);}
  .save-fab:hover::after{opacity:1;}
  .save-fab:active{transform:translateY(-1px) scale(.98);box-shadow:0 8px 16px rgba(47,128,237,.28), 0 2px 6px rgba(47,128,237,.18);transition-duration:.08s;}
  .save-fab:focus-visible{outline:none;box-shadow:0 14px 30px rgba(47,128,237,.35), 0 4px 10px rgba(47,128,237,.2), 0 0 0 4px rgba(47,128,237,.28);}
  .save-fab.dirty{animation:saveFabIn .55s cubic-bezier(.16,1,.3,1) both, saveFabPulse 2.2s ease-in-out 1s infinite;}
  .save-fab-dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 3px rgba(47,128,237,.35);opacity:0;transform:scale(0);transition:opacity .3s ease, transform .3s cubic-bezier(.16,1,.3,1);animation:wfPulse 1.6s ease-in-out infinite;}
  .save-fab.dirty .save-fab-dot{opacity:1;transform:scale(1);}
  .save-fab-icon{display:flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0;transition:transform .28s cubic-bezier(.16,1,.3,1);}
  .save-fab-icon svg{width:18px;height:18px;display:block;}
  .save-fab:hover .save-fab-icon{transform:translateY(-2px) rotate(-6deg);}
  .save-fab.saving{cursor:progress;filter:saturate(.85);}
  .save-fab.saving .save-fab-icon{animation:wfSpin .75s linear infinite;transform:none;}
  .save-fab.saved{background:linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);box-shadow:0 14px 30px rgba(39,174,96,.35), 0 4px 10px rgba(39,174,96,.2);animation:saveFabPop .5s cubic-bezier(.16,1,.3,1);}
  .save-fab.saved .save-fab-icon{transform:none;animation:saveIconPop .45s cubic-bezier(.16,1,.3,1);}
  .save-fab-label{white-space:nowrap;}
  @media (max-width:640px){.save-fab{right:16px;bottom:16px;padding:11px 16px 11px 14px;font-size:13px;}.save-fab-label{font-size:12.5px;}}

  /* ============ CUSTOM LEAVE FORM DROPDOWNS ============ */
  .lf-select{position:relative;width:100%;}
  .lf-select-trigger{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--card);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--text);text-align:left;will-change:transform;transition:border-color .2s ease, box-shadow .25s ease, transform .18s cubic-bezier(.16,1,.3,1), background .2s ease;}
  .lf-select-trigger:hover:not([disabled]){border-color:var(--primary);box-shadow:0 4px 12px rgba(47,128,237,.1);transform:translateY(-1px);}
  .lf-select-trigger:active:not([disabled]){transform:translateY(0) scale(.98);}
  .lf-select-trigger:focus-visible{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,128,237,.2);}
  .lf-select-trigger.open{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,128,237,.14);}
  .lf-select-trigger[disabled]{cursor:not-allowed;background:var(--bg-2);color:var(--text-soft);}
  .lf-select-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lf-select-chevron{width:11px;height:11px;flex-shrink:0;opacity:.55;transition:transform .22s cubic-bezier(.16,1,.3,1), opacity .18s ease;}
  .lf-select-trigger:hover .lf-select-chevron{opacity:.85;}
  .lf-select-trigger.open .lf-select-chevron{transform:rotate(180deg);opacity:.85;}
  .lf-select-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 16px 36px rgba(15,23,42,.14), 0 3px 8px rgba(15,23,42,.05);padding:5px;z-index:80;max-height:300px;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transform-origin:top center;pointer-events:none;transition:opacity .12s ease-out, transform .18s cubic-bezier(.16,1,.3,1), visibility 0s linear .18s;}
  .lf-select-panel.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:auto;transition:opacity .16s ease-out, transform .24s cubic-bezier(.16,1,.3,1), visibility 0s;}
  .lf-option{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--text);text-align:left;white-space:nowrap;opacity:0;transform:translateY(-4px);transition:background .15s ease, transform .15s ease, color .15s ease;}
  .lf-select-panel.open .lf-option{animation:attOptIn .22s cubic-bezier(.16,1,.3,1) forwards;}
  .lf-option:nth-child(1){animation-delay:.02s}.lf-option:nth-child(2){animation-delay:.05s}.lf-option:nth-child(3){animation-delay:.08s}.lf-option:nth-child(4){animation-delay:.11s}.lf-option:nth-child(5){animation-delay:.14s}.lf-option:nth-child(6){animation-delay:.17s}.lf-option:nth-child(7){animation-delay:.20s}.lf-option:nth-child(n+8){animation-delay:.23s}
  .lf-option:focus-visible{outline:none;background:var(--bg-2);}
  .lf-option:hover{background:var(--primary-soft);transform:translateX(3px);}
  .lf-option.selected{background:rgba(47,128,237,.08);font-weight:600;}
  .lf-option .lf-option-label{flex:1;}
  .lf-option .lf-option-check{width:12px;height:12px;flex-shrink:0;opacity:0;transform:scale(.6);transition:opacity .18s ease, transform .24s cubic-bezier(.16,1,.3,1);color:var(--primary);}
  .lf-option.selected .lf-option-check{opacity:1;transform:scale(1);}

  /* ============ CUSTOM DATE PICKER ============ */
  .lf-date{position:relative;width:100%;}

  .lf-date-trigger:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(47,128,237,.1);transform:translateY(-1px);}

<body>
<div class="app" id="app"></div>

<script>
/* ============================= DATA MODEL ============================= */
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function toISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function addDays(dateStr, n){ const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function startOfWeek(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate()+diff);
  return toISO(d);
}
function fmtDate(iso){ const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function fmtDay(iso){ const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US',{weekday:'short'}); }
function hoursBetween(start,end){
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins < 0) mins += 24*60;
  return mins/60;
}

/* ============================= TOTP ============================= */
const B32_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function randomBytes(len){
  const arr = new Uint8Array(len);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(arr);
  else for(let i=0;i<len;i++) arr[i] = Math.floor(Math.random()*256);
  return arr;
}
function base32Encode(bytes){
  let bits = 0, value = 0, out = '';
  for(let i=0;i<bytes.length;i++){
    value = (value << 8) | bytes[i];
    bits += 8;
    while(bits >= 5){ out += B32_CHARS[(value >>> (bits - 5)) & 31]; bits -= 5; }
  }
  if(bits > 0) out += B32_CHARS[(value << (5 - bits)) & 31];
  return out;
}
function base32Decode(str){
  const clean = String(str||'').toUpperCase().replace(/=+$/,'').replace(/\s+/g,'');
  let bits = 0, value = 0;
  const out = [];
  for(let i=0;i<clean.length;i++){
    const idx = B32_CHARS.indexOf(clean[i]);
    if(idx === -1) continue;
    value = (value << 5) | idx;
    bits += 5;
    if(bits >= 8){ out.push((value >>> (bits - 8)) & 0xff); bits -= 8; }
  }
  return new Uint8Array(out);
}
function generateTotpSecret(){ return base32Encode(randomBytes(20)); }
async function totpCodeForCounter(secretBase32, counter){
  if(!(window.crypto && crypto.subtle)){
    throw new Error('Two-factor auth requires a secure context. Open this file over localhost or HTTPS.');
  }
  const keyBytes = base32Decode(secretBase32);
  if(!keyBytes.length) throw new Error('Invalid 2FA secret.');
  const msg = new Uint8Array(8);
  let c = counter;
  for(let i=7;i>=0;i--){ msg[i] = c & 0xff; c = Math.floor(c / 256); }
  const key = await crypto.subtle.importKey('raw', keyBytes, {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, msg));
  const offset = sig[sig.length - 1] & 0x0f;
  const bin = ((sig[offset] & 0x7f) << 24) | ((sig[offset + 1] & 0xff) << 16) | ((sig[offset + 2] & 0xff) << 8) | (sig[offset + 3] & 0xff);
  return String(bin % 1000000).padStart(6, '0');
}
async function verifyTotp(secretBase32, input){
  const clean = String(input||'').replace(/\D/g,'');
  if(clean.length !== 6) return {ok:false, reason:'Enter the 6-digit code.'};
  const currentCounter = Math.floor(Date.now() / 1000 / 30);
  const deltas = [-3, -2, -1, 0, 1, 2, 3];
  for(let i=0;i<deltas.length;i++){
    const counter = currentCounter + deltas[i];
    const expected = await totpCodeForCounter(secretBase32, counter);
    if(expected === clean) return {ok:true, counter};
  }
  return {ok:false, reason:'Incorrect code. Make sure your phone\'s time is set to automatic, then enter the freshest code your app shows.'};
}

/* ============================= AUTHENTICATION ============================= */
async function sha256Hex(text){
  if(window.crypto && crypto.subtle){
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h = 0;
  for(let i=0;i<text.length;i++){ h = (Math.imul(31,h) + text.charCodeAt(i))|0; }
  return 'fallback_' + (h>>>0).toString(16);
}
function randomHex(len){ return Array.from(randomBytes(len)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function hashPassword(password, salt){
  let out = salt + ':' + password;
  for(let i=0;i<2000;i++){ out = await sha256Hex(salt + out); }
  return out;
}
function genTempPassword(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
  let pw = '';
  for(let i=0;i<10;i++) pw += chars[Math.floor(Math.random()*chars.length)];
  return pw;
}
function passwordPolicyErrors(pw){
  const errs = [];
  if(!pw || pw.length < 8) errs.push('at least 8 characters');
  if(!/[A-Z]/.test(pw||'')) errs.push('an uppercase letter');
  if(!/[a-z]/.test(pw||'')) errs.push('a lowercase letter');
  if(!/[0-9]/.test(pw||'')) errs.push('a number');
  if(!/[^A-Za-z0-9]/.test(pw||'')) errs.push('a special character');
  return errs;
}
function passwordStrength(pw){
  const errs = passwordPolicyErrors(pw);
  const metRules = 5 - errs.length;
  if(!pw) return 0;
  if(metRules <= 2) return 1;
  if(metRules <= 4) return 2;
  return 3;
}
const AUTH_MAX_ATTEMPTS = 3;
const AUTH_LOCK_MS = 75 * 1000;
const LOGIN_FAILURE_STORAGE_KEY = 'wfms23_login_failures_v1';
const AUTH_IDLE_LIMIT_MS = 10 * 60 * 1000;
const OTP_MAX_ATTEMPTS = 5;

function readLoginFailureState(){
  try{
    const saved = JSON.parse(localStorage.getItem(LOGIN_FAILURE_STORAGE_KEY)||'null');
    if(!saved || typeof saved !== 'object') return {attempts:0, lockedUntil:null};
    if(saved.lockedUntil && saved.lockedUntil <= Date.now()){
      localStorage.removeItem(LOGIN_FAILURE_STORAGE_KEY);
      return {attempts:0, lockedUntil:null};
    }
    return {attempts:Number(saved.attempts)||0, lockedUntil:Number(saved.lockedUntil)||null};
  }catch(e){ return {attempts:0, lockedUntil:null}; }
}
function saveLoginFailureState(value){
  try{ localStorage.setItem(LOGIN_FAILURE_STORAGE_KEY, JSON.stringify(value)); }catch(e){}
}
function recordLoginFailure(accountLockUntil){
  const failures = readLoginFailureState();
  if(accountLockUntil){
    failures.attempts = AUTH_MAX_ATTEMPTS;
    failures.lockedUntil = accountLockUntil;
  }else{
    failures.attempts += 1;
    if(failures.attempts >= AUTH_MAX_ATTEMPTS) failures.lockedUntil = Date.now() + AUTH_LOCK_MS;
  }
  saveLoginFailureState(failures);
  return failures;
}
function clearLoginFailureState(){
  try{ localStorage.removeItem(LOGIN_FAILURE_STORAGE_KEY); }catch(e){}
}

function findUserByUsername(username){
  return state.users.find(u => u.username.toLowerCase() === String(username||'').toLowerCase());
}
function currentUser(){ return state.session ? state.users.find(u => u.id === state.session.userId) : null; }
function hasRole(...roles){ const u = currentUser(); return !!u && roles.includes(u.role); }
function markActive(){ if(state.session){ state.session.lastActive = Date.now(); } }

async function attemptLogin(username, password){
  const genericError = 'Incorrect username or password.';
  const user = findUserByUsername(username);
  if(!user){ await hashPassword(password, randomHex(8)); return {ok:false, error:genericError}; }
  if(!user.active) return {ok:false, error:'This account has been deactivated. Contact an administrator.'};
  if(user.lockedUntil && Date.now() < user.lockedUntil){
    return { ok:false, error:`Account temporarily locked after repeated failed attempts. Try again in ${Math.ceil((user.lockedUntil-Date.now())/1000)}s.`, locked:true, lockedUntil:user.lockedUntil };
  }
  if(user.lockedUntil && Date.now() >= user.lockedUntil){ user.lockedUntil = null; user.failedAttempts = 0; }
  const hash = await hashPassword(password, user.salt);
  if(hash !== user.hash){
    user.failedAttempts = (user.failedAttempts||0) + 1;
    if(user.failedAttempts >= AUTH_MAX_ATTEMPTS){
      user.lockedUntil = Date.now() + AUTH_LOCK_MS;
      user.failedAttempts = 0;
      return { ok:false, error:`Too many failed attempts. Account locked for ${AUTH_LOCK_MS/1000} seconds.`, locked:true, lockedUntil:user.lockedUntil };
    }
    return {ok:false, error:genericError};
  }
  user.failedAttempts = 0;
  user.lockedUntil = null;
  if(user.totpSecret) return {ok:true, stage:'verify', user};
  return {ok:true, stage:'enroll', user};
}
function completeLogin(user){
  user.lastLogin = Date.now();
  state.session = {userId:user.id, loginAt:Date.now(), lastActive:Date.now()};
  persistSession();
  state.otpStage = null; state.otpUser = null; state.otpSecret = null;
  state.otpError = null; state.otpBusy = false; state.otpAttempts = 0;
  state.loginError = null; state.loginBusy = false; state.view = 'dashboard';
  state.notifOpen = false;
  setTimeout(() => {
    if(state.session && state.session.userId === user.id){
      const unread = unreadNotificationsFor(user).length;
      if(unread > 0){
        showToast('You have new notifications', `You have ${unread} unread notification${unread>1?'s':''}. Click the bell to view.`, {tone:'info'});
      }
    }
  }, 800);
}
function logout(){
  state.session = null;
  clearSession();
  state.loginError = null;
  state.otpStage = null; state.otpUser = null; state.otpSecret = null;
  state.otpError = null; state.otpAttempts = 0; state.view = 'dashboard';
  state.notifOpen = false; state.chatOpen = false; state.chatMessages = [];
  render();
}
function cancelOTP(){
  state.otpStage = null; state.otpUser = null; state.otpSecret = null;
  state.otpError = null; state.otpBusy = false; state.otpAttempts = 0;
}
let idleWatchStarted = false;
function startIdleWatch(){
  if(idleWatchStarted) return;
  idleWatchStarted = true;
  ['mousemove','keydown','click','scroll'].forEach(evt=>{ document.addEventListener(evt, markActive, {passive:true}); });
  setInterval(()=>{
    if(!state.session) return;
    if(Date.now() - state.session.lastActive > AUTH_IDLE_LIMIT_MS){
      logout();
      alert('You were signed out automatically after 10 minutes of inactivity.');
    } else {
      persistSession();
    }
  }, 5000);
}
function visibleEmployees(){
  const u = currentUser();
  if(!u) return [];
  if(u.role === 'Employee') return state.employees.filter(e=>e.id===u.employeeId);
  return state.employees;
}
function canManageSchedule(){ return hasRole('Admin','Manager'); }
function canManageAttendance(){ return hasRole('Admin','Manager'); }
function canDecideLeave(){ return hasRole('Admin','Manager'); }
function canManageAccounts(){ return hasRole('Admin'); }

const todayISO = toISO(new Date());
const weekStartDefault = startOfWeek(todayISO);

const state = {
  view:'dashboard',
  weekStart: weekStartDefault,
  session:null,
  loginError:null,
  loginBusy:false,
  authReady:false,
  showLoginPw:false,
  accountError:null,
  accountSuccess:null,
  otpStage:null, otpUser:null, otpSecret:null, otpError:null, otpBusy:false, otpAttempts:0,
  openAttKey:null,
  notifOpen:false,
  leaveTrashOpen:false,
  leaveDeleteMode:false,
  selectedLeaveIds:[],
  scheduleDirty:false,
  chatOpen:false,
  chatMessages:[],
  chatBusy:false,
  chatError:null,
  chatShowKeySetup:false,
  chatDemoMode:false,
  showAiKey:true,
  aiKey:'',
  aiProvider:'groq',
  addShiftModal:null,
  suggTarget:{employeeId:null, date:null},
  users:[],
  employees:[
    {id:'e1', name:'Marisol Ibarra', role:'Tour Guide', type:'Full-time', email:'marisol.ibarra@voyaops.com', hourlyRate:220},
    {id:'e2', name:'Dennis Katigbak', role:'Tour Guide', type:'Full-time', email:'dennis.katigbak@voyaops.com', hourlyRate:220},
    {id:'e3', name:'Anna Reyes', role:'Front Desk Agent', type:'Full-time', email:'anna.reyes@voyaops.com', hourlyRate:170},
    {id:'e4', name:'Ronnel Cruz', role:'Van Driver', type:'Part-time', email:'ronnel.cruz@voyaops.com', hourlyRate:150},
    {id:'e5', name:'Kyla Fernandez', role:'Bookings Coordinator', type:'Full-time', email:'kyla.fernandez@voyaops.com', hourlyRate:190},
    {id:'e6', name:'Paolo Villanueva', role:'Van Driver', type:'Seasonal', email:'paolo.villanueva@voyaops.com', hourlyRate:150}
  ],
  shifts:[], attendance:[], leaveRequests:[], deletedLeaveRequests:[],
  notifications:[]
};

/* ============ PERSISTENCE ============ */
const STORAGE_KEY = 'wfms23_state_v1';
// Keep authentication per tab so separate accounts can stay signed in independently.
const SESSION_KEY = 'wfms23_tab_session_v1';
const LEGACY_SESSION_KEY = 'wfms23_session_v1';

function persistState(){
  try{
    const snapshot = {
      v: 2,
      shifts: state.shifts,
      attendance: state.attendance,
      leaveRequests: state.leaveRequests,
      deletedLeaveRequests: state.deletedLeaveRequests,
      users: state.users,
      notifications: state.notifications,
      weekStart: state.weekStart,
      savedAt: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    return true;
  }catch(e){ return false; }
}
function loadPersistedState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s) return false;
    if(s.v !== 1 && s.v !== 2) return false;
    if(Array.isArray(s.shifts)) state.shifts = s.shifts;
    if(Array.isArray(s.attendance)) state.attendance = s.attendance;
    if(Array.isArray(s.leaveRequests)) state.leaveRequests = s.leaveRequests;
    if(Array.isArray(s.deletedLeaveRequests)) state.deletedLeaveRequests = s.deletedLeaveRequests;
    if(Array.isArray(s.users)) state.users = s.users;
    if(Array.isArray(s.notifications)) state.notifications = s.notifications;
    if(typeof s.weekStart === 'string') state.weekStart = s.weekStart;
    return true;
  }catch(e){ return false; }
}
function persistSession(){
  try{
    if(!state.session){ sessionStorage.removeItem(SESSION_KEY); return; }

  }catch(e){}
}
function loadSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.userId) return null;
    return s;
  }catch(e){ return null; }
}
function clearSession(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  // Remove the previous shared session key so it cannot be mistaken for a tab session.
  try{ localStorage.removeItem(LEGACY_SESSION_KEY); }catch(e){}
}
function restoreSession(){
  const saved = loadSession();
  if(!saved) return false;
  const user = state.users.find(u => u.id === saved.userId);
  if(!user || !user.active){ clearSession(); return false; }
  const last = saved.lastActive || saved.loginAt || Date.now();
  if(Date.now() - last > AUTH_IDLE_LIMIT_MS){ clearSession(); return false; }
  state.session = { userId: user.id, loginAt: saved.loginAt || Date.now(), lastActive: Date.now() };
  return true;
}

function formatRelativeTime(ts){
  const diff = Math.floor((Date.now() - ts) / 1000);
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.floor(diff/60) + 'm ago';
  if(diff < 86400) return Math.floor(diff/3600) + 'h ago';

function showToast(title, message, opts){
  let stack = document.getElementById('toast-stack');
  if(!stack){
    stack = document.createElement('div');
    stack.id = 'toast-stack';
    stack.className = 'toast-stack';
    document.body.appendChild(stack);
  }
  const tone = (opts && opts.tone) || 'info';
  const t = document.createElement('div');
  t.className = 'toast toast-' + tone;
  t.innerHTML = `
    <div class="toast-icon">${notifIconSvg(tone)}</div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      <div class="toast-message">${message}</div>
    </div>
    <button class="toast-close" aria-label="Dismiss">&times;</button>
  `;
  stack.appendChild(t);
  const dismiss = () => {
    if(!t.parentNode) return;
    t.classList.add('leaving');
    setTimeout(() => { t.remove(); if(stack && !stack.children.length) stack.remove(); }, 400);
  };
  t.querySelector('.toast-close').addEventListener('click', dismiss);
  setTimeout(dismiss, 6000);
}

function statusBadge(status){
  const map = { 'Present':'present','Late':'late','Absent':'absent','On Leave':'leave','Scheduled':'scheduled','No Status':'nostatus','On Shift':'onshift' };
  return badge(status, map[status] || 'scheduled');

function computeTimesheet(weekStart, employeeList){
  const dates = weekDates(weekStart);
  const emps = employeeList || state.employees;
  return emps.map(emp=>{
    let regular = 0, leaveHours = 0, lateCount = 0, absentCount = 0, daysWorked = 0;
    const rows = dates.map(date=>{
      const shift = state.shifts.find(s=>s.employeeId===emp.id && s.date===date);
      const att = attendanceFor(emp.id, date);
      let hours = 0, label = '—';
      if(att){
        if(att.status==='Present' || att.status==='Late'){
          hours = shift ? hoursBetween(att.clockIn, att.clockOut) : 0;
          regular += hours; daysWorked++;
          if(att.status==='Late') lateCount++;
          label = hours.toFixed(1)+'h';
        } else if(att.status==='On Leave'){ hours = 8; leaveHours += hours; label = '8.0h (leave)'; }
        else if(att.status==='Absent'){ absentCount++; label = '0.0h'; }
      } else if(shift){ label = 'scheduled'; }
      return {date, shift, att, hours, label};
    });
    const total = regular + leaveHours;
    const overtime = Math.max(0, regular - 40);
    return {emp, rows, regular, leaveHours, total, overtime, lateCount, absentCount, daysWorked};
  });
}

function lfBuildCalendar(selectedISO, viewYear, viewMonth){
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();
  const todayStr = toISO(new Date());
  const currentMonth = new Date(); currentMonth.setDate(1); currentMonth.setHours(0,0,0,0);
  const previousMonth = new Date(viewYear, viewMonth - 1, 1);
  const cannotGoBack = previousMonth < currentMonth;
  const monthName = first.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  let html = `
    <div class="lf-date-head">
      <div class="lf-date-month">${monthName}</div>
      <div class="lf-date-nav">
        <button type="button" data-lf-nav="-1" aria-label="Previous month"${cannotGoBack?' disabled':''}><svg viewBox="0 0 12 12" fill="none"><path d="M7.5 3L4.5 6L7.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-lf-nav="1" aria-label="Next month"><svg viewBox="0 0 12 12" fill="none"><path d="M4.5 3L7.5 6L4.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="lf-date-grid">
      ${['S','M','T','W','T','F','S'].map(d => `<div class="lf-date-dow">${d}</div>`).join('')}
  `;
  for(let i = startDow - 1; i >= 0; i--){
    html += `<button type="button" class="lf-day outside" disabled tabindex="-1">${daysInPrev - i}</button>`;
  }
  for(let day = 1; day <= daysInMonth; day++){
    const iso = toISO(new Date(viewYear, viewMonth, day));
    const isToday = iso === todayStr;
    const isSelected = iso === selectedISO;
    const isPast = iso < todayStr;
    html += `<button type="button" class="lf-day${isToday?' today':''}${isSelected?' selected':''}${isPast?' disabled':''}" data-lf-day="${iso}"${isPast?' disabled aria-disabled="true" tabindex="-1"':''}>${day}</button>`;
  }
  const totalCells = startDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for(let i = 1; i <= remaining; i++){
    html += `<button type="button" class="lf-day outside" disabled tabindex="-1">${i}</button>`;
  }
  html += `</div>`;
  return html;
}
function lfOpenDatePicker(wrapper){
  const key = wrapper.dataset.lfDate;
  const hidden = wrapper.querySelector('input[data-lf-value="' + key + '"]');
  const panel = wrapper.querySelector('.lf-date-panel');
  const trigger = wrapper.querySelector('.lf-date-trigger');
  if(!hidden || !panel || !trigger) return;
  const selectedISO = hidden.value;
  const ref = selectedISO ? new Date(selectedISO + 'T00:00:00') : new Date();
  panel.dataset.viewYear = ref.getFullYear();
  panel.dataset.viewMonth = ref.getMonth();
  panel.innerHTML = lfBuildCalendar(selectedISO, ref.getFullYear(), ref.getMonth());
  panel.classList.add('open');
  trigger.classList.add('open');
}
function lfNavMonth(panel, delta){
  let y = parseInt(panel.dataset.viewYear, 10);
  let m = parseInt(panel.dataset.viewMonth, 10);
  const now = new Date(); now.setDate(1); now.setHours(0,0,0,0);
  const target = new Date(y, m + delta, 1);
  if(target < now) return;
  m += delta;
  if(m < 0){ m = 11; y--; }
  if(m > 11){ m = 0; y++; }
  panel.dataset.viewYear = y;
  panel.dataset.viewMonth = m;
  const wrapper = panel.closest('.lf-date');
  if(!wrapper) return;
  const key = wrapper.dataset.lfDate;
  const hidden = wrapper.querySelector('input[data-lf-value="' + key + '"]');
  panel.innerHTML = lfBuildCalendar(hidden ? hidden.value : '', y, m);
}

function buildChatContext(){
  const u = currentUser();
  if(!u) return '';
  const emps = visibleEmployees();
  const empIds = new Set(emps.map(e=>e.id));
  const ts = computeTimesheet(state.weekStart, emps);
  const today = todayISO;
  const upcoming = state.shifts
    .filter(s => empIds.has(s.employeeId) && s.date >= today)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 20)
    .map(s => `[${s.id}] ${s.date} ${s.start}-${s.end} ${s.tour} — ${empName(s.employeeId)}`);
  const leaveSummary = state.leaveRequests
    .filter(l => empIds.has(l.employeeId))
    .map(l => `[${l.id}] ${empName(l.employeeId)}: ${l.type} ${l.startDate} → ${l.endDate} [${l.status}]`);
  const weeklySummary = ts.map(r =>
    `${r.emp.name}: ${r.total.toFixed(1)}h, ${r.overtime.toFixed(1)}h OT, ${r.lateCount} late, ${r.absentCount} absent`
  ).join('\n');
  return `
You are an AI assistant embedded in a Workforce Management system for "Travel & Tours".

Current user: ${u.name} (role: ${u.role}${u.employeeId ? ', employeeId=' + u.employeeId : ''})
Today: ${today}
Week starts: ${fmtDate(state.weekStart)}
Permissions: schedule=${canManageSchedule()}, attendance=${canManageAttendance()}, decideLeave=${canDecideLeave()}

EMPLOYEE ROSTER (use these exact IDs):
${state.employees.map(e => `  ${e.id} = ${e.name} (${e.role})`).join('\n')}

UPCOMING SHIFTS (with IDs):
${upcoming.join('\n') || '(none)'}

THIS WEEK HOURS:
${weeklySummary || '(none)'}

LEAVE REQUESTS (with IDs):
${leaveSummary.join('\n') || '(none)'}

=== ACTION PROTOCOL (READ CAREFULLY) ===
When the user asks you to PERFORM an action, you MUST end your reply with one or more action blocks.
Format (exactly, no spaces, no backticks, one block per line):

[ACTION:add_shift]{"employeeId":"e1","date":"2026-09-19","start":"08:00","end":"16:00","tour":"General Duty"}

Valid types:
- add_shift       {"employeeId","date","start","end","tour"}
- remove_shift    {"employeeId","date"} OR {"shiftId"}
- set_attendance  {"employeeId","date","status"}
- approve_leave   {"leaveId"}
- deny_leave      {"leaveId"}
- file_leave      {"employeeId","startDate","endDate","type","reason"}

HARD RULES:
1. If the user requests an action, you MUST emit an [ACTION:...] block. Never just describe the action.
2. Convert "tomorrow", "next Monday", etc. to YYYY-MM-DD using today's date above.
3. "Marisol" = e1, "Dennis" = e2, "Anna" = e3, "Ronnel" = e4, "Kyla" = e5, "Paolo" = e6.
4. If start or end time is missing, ASK for it — do not emit an action block.
5. Never claim the action is already done. Say "I'll add..." or "Adding...".
6. The action block must be the LAST thing in your reply.
`.trim();
}

async function callAI(messages){
  const key = state.aiKey;
  if(!key) throw new Error('No API key set.');
  const provider = PROVIDERS[state.aiProvider] || PROVIDERS.groq;
  const system = buildChatContext();
  const body = provider.buildBody(system, messages);
  const url = provider.buildUrl ? provider.buildUrl(key) : provider.url;
  const res = await fetch(url, {
    method: 'POST',
    headers: provider.buildHeaders(key),
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errText = await res.text();
    let msg = provider.label + ' error (' + res.status + ').';
    try{
      const j = JSON.parse(errText);
      if(j.error && j.error.message) msg = j.error.message;
      else if(j.error) msg = typeof j.error === 'string' ? j.error : JSON.stringify(j.error);
    }catch(e){}
    if(res.status === 401 || res.status === 403) msg = 'Invalid API key. Check that you pasted the correct ' + provider.label + ' key.';
    if(res.status === 429) msg = 'Rate limit reached on the ' + provider.label + ' free tier. Wait a moment and try again.';
    throw new Error(msg);
  }
  const data = await res.json();
  return provider.parseResponse(data);
}

function parseActionsFromReply(text){
  const actions = [];
  const re = /\[ACTION:([a-z_]+)\](\{[^\n]*?\})/gi;
  let m;
  while((m = re.exec(String(text||''))) !== null){
    try { actions.push({ type: m[1].toLowerCase(), params: JSON.parse(m[2]) }); }
    catch(e){}
  }
  return actions;
}
function stripActionsFromReply(text){
  return String(text||'')
    .replace(/\[ACTION:[a-z_]+\]\{[^\n]*?\}/gi, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
function executeAction(type, params){
  const u = currentUser();
  if(!u) return { ok:false, message:'You must be signed in.' };

  if(type === 'add_shift'){
    if(!canManageSchedule()) return { ok:false, message:'You do not have permission to schedule shifts.' };
    const employeeId = String(params.employeeId||'');
    const emp = state.employees.find(e => e.id === employeeId);
    if(!emp) return { ok:false, message:'Employee not found.' };
    const date = String(params.date||'');
    const start = String(params.start||'');
    const end = String(params.end||'');
    const tour = String(params.tour||'General Duty');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return { ok:false, message:'Invalid or missing date (need YYYY-MM-DD).' };
    if(!/^\d{2}:\d{2}$/.test(start) || !/^\d{2}:\d{2}$/.test(end)) return { ok:false, message:'Start and end times must be HH:MM.' };
    if(hoursBetween(start, end) <= 0) return { ok:false, message:'End time must be after start time.' };
    if(isOnApprovedLeave(employeeId, date)) return { ok:false, message:emp.name + ' is on approved leave on ' + fmtDate(date) + '.' };
    const dup = state.shifts.find(s => s.employeeId === employeeId && s.date === date && s.start === start && s.end === end && (s.tour||'') === tour);
    if(dup) return { ok:false, message:emp.name + ' already has an identical shift on ' + fmtDate(date) + '.' };
    state.shifts.push({ id: uid('sh'), employeeId, date, start, end, tour });
    state.scheduleDirty = true;
    pushNotification({employeeId}, 'New shift assigned', 'You have a new shift on ' + fmtDate(date) + ' from ' + start + ' to ' + end + ' (' + tour + ').', { tone:'info' });
    pushNotification({role:'Manager'}, 'Shift added', emp.name + ' was assigned a shift on ' + fmtDate(date) + ' from ' + start + ' to ' + end + '.', { tone:'info' });
    pushNotification({role:'Admin'},   'Shift added', emp.name + ' was assigned a shift on ' + fmtDate(date) + ' from ' + start + ' to ' + end + '.', { tone:'info' });
    persistState(); render();
    return { ok:true, message:'Added shift for ' + emp.name + ' on ' + fmtDate(date) + ' (' + start + '–' + end + ').' };
  }

  if(type === 'remove_shift'){
    if(!canManageSchedule()) return { ok:false, message:'You do not have permission to remove shifts.' };
    let shift = null;
    if(params.shiftId) shift = state.shifts.find(s => s.id === params.shiftId);
    else if(params.employeeId && params.date) shift = state.shifts.find(s => s.employeeId === params.employeeId && s.date === params.date);
    if(!shift) return { ok:false, message:'No matching shift found.' };
    const emp = state.employees.find(e => e.id === shift.employeeId);
    const label = fmtDate(shift.date) + ' (' + shift.start + '–' + shift.end + ' · ' + shift.tour + ')';
    state.shifts = state.shifts.filter(s => s.id !== shift.id);
    state.attendance = state.attendance.filter(a => a.shiftId !== shift.id);
    state.scheduleDirty = true;
    pushNotification({employeeId: shift.employeeId}, 'Shift removed', 'Your shift on ' + label + ' has been removed.', { tone:'warning' });
    pushNotification({role:'Manager'}, 'Shift removed', emp.name + "'s shift on " + label + ' has been removed.', { tone:'info' });
    pushNotification({role:'Admin'},   'Shift removed', emp.name + "'s shift on " + label + ' has been removed.', { tone:'info' });
    persistState(); render();
    return { ok:true, message:'Removed ' + emp.name + "'s shift on " + label + '.' };
  }

  if(type === 'set_attendance'){
    if(!canManageAttendance()) return { ok:false, message:'You do not have permission to change attendance.' };
    const employeeId = String(params.employeeId||'');
    const date = String(params.date||'');
    const status = String(params.status||'');
    const shift = state.shifts.find(s => s.employeeId === employeeId && s.date === date);
    if(!shift) return { ok:false, message:'No shift found for that employee and date.' };
    applyAttendanceStatus(employeeId, date, shift.id, status);
    return { ok:true, message:'Set attendance to "' + (status || 'No Status') + '" for ' + empName(employeeId) + ' on ' + fmtDate(date) + '.' };
  }

  if(type === 'approve_leave' || type === 'deny_leave'){
    if(!canDecideLeave()) return { ok:false, message:'You do not have permission to decide leave.' };
    const l = state.leaveRequests.find(x => x.id === params.leaveId);
    if(!l) return { ok:false, message:'Leave request not found.' };
    if(type === 'approve_leave'){
      l.status = 'Approved';
      state.shifts.filter(s => s.employeeId === l.employeeId && s.date >= l.startDate && s.date <= l.endDate).forEach(shift => {
        state.attendance = state.attendance.filter(a => !(a.employeeId === l.employeeId && a.date === shift.date));
        state.attendance.push({ id:uid('at'), employeeId:l.employeeId, date:shift.date, shiftId:shift.id, clockIn:null, clockOut:null, status:'On Leave' });
      });
      pushNotification({employeeId: l.employeeId}, 'Leave approved', 'Your ' + l.type + ' leave from ' + fmtDate(l.startDate) + ' to ' + fmtDate(l.endDate) + ' has been approved.', { tone:'success' });
      persistState(); render();
      return { ok:true, message:'Approved ' + empName(l.employeeId) + "'s " + l.type + ' leave.' };
    } else {
      l.status = 'Denied';
      pushNotification({employeeId: l.employeeId}, 'Leave denied', 'Your ' + l.type + ' leave from ' + fmtDate(l.startDate) + ' to ' + fmtDate(l.endDate) + ' has been denied.', { tone:'danger' });
      persistState(); render();
      return { ok:true, message:'Denied ' + empName(l.employeeId) + "'s " + l.type + ' leave.' };
    }
  }

  if(type === 'file_leave'){
    const allowed = new Set(visibleEmployees().map(e => e.id));
    const employeeId = String(params.employeeId||'');
    if(!allowed.has(employeeId)) return { ok:false, message:'You cannot file leave for that employee.' };
    const startDate = String(params.startDate||'');
    const endDate = String(params.endDate||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(startDate) || !/^\d{4}-\d{2}-\d{2}$/.test(endDate)) return { ok:false, message:'Start and end dates must be YYYY-MM-DD.' };
    if(endDate < startDate) return { ok:false, message:'End date must be on or after start date.' };
    state.leaveRequests.push({ id:uid('lv'), employeeId, startDate, endDate, type: params.type || 'Paid', reason: params.reason || 'No reason provided', status:'Pending' });
    pushNotification({role:'Manager'}, 'New leave request', empName(employeeId) + ' filed a ' + (params.type||'Paid') + ' leave request.', { tone:'info' });
    pushNotification({role:'Admin'},   'New leave request', empName(employeeId) + ' filed a ' + (params.type||'Paid') + ' leave request.', { tone:'info' });
    persistState(); render();
    return { ok:true, message:'Filed leave for ' + empName(employeeId) + '.' };
  }

  return { ok:false, message:'Unsupported action: ' + type };
}

function parseLocalIntent(userText){
  const t = String(userText||'').toLowerCase();
  if(!t) return null;

  const wantsAdd    = /\b(schedule|assign|shift|add|put|set)\b/.test(t) && !/\b(remove|delete|cancel|unassign)\b/.test(t);
  const wantsRemove = /\b(remove|delete|cancel|unassign)\b/.test(t);
  if(!wantsAdd && !wantsRemove) return null;

  let employeeId = null;
  for(const e of state.employees){
    const parts = e.name.toLowerCase().split(/\s+/);
    if(t.includes(e.name.toLowerCase()) || parts.some(p => p.length > 3 && t.includes(p))){
      employeeId = e.id; break;
    }
  }
  if(!employeeId) return null;

  const d = parseLocalDate(t);
  if(!d) return null;

  if(wantsRemove){
    return { type:'remove_shift', params:{ employeeId, date:d } };
  }

  const times = extractTimes(t);
  if(!times || times.length < 2) return null;
  const [start, end] = times;

  let tour = 'General Duty';
  const tourMatch = t.match(/\b(?:for|as|assignment|tour)\s+([a-z][a-z\s]{2,40})/i);
  if(tourMatch){
    const cand = tourMatch[1].trim().replace(/\b(on|at|from|to|shift|scheduled?)\b.*$/,'').trim();
    if(cand.length >= 3) tour = cand.replace(/\b\w/g, c => c.toUpperCase());
  }

  return { type:'add_shift', params:{ employeeId, date:d, start, end, tour } };
}

function parseLocalDate(t){
  const now = new Date();
  const todayStr = toISO(now);

  let m = t.match(/\b(\d{4}-\d{2}-\d{2})\b/);
  if(m) return m[1];

  m = t.match(/\b(\d{1,2})\/(\d{1,2})\b/);
  if(m){
    const mm = String(m[1]).padStart(2,'0');
    const dd = String(m[2]).padStart(2,'0');
    return now.getFullYear() + '-' + mm + '-' + dd;
  }

  const months = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12 };
  m = t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/);
  if(m){
    const mm = String(months[m[1]]).padStart(2,'0');
    const dd = String(m[2]).padStart(2,'0');
    return now.getFullYear() + '-' + mm + '-' + dd;
  }

  if(/\btomorrow\b/.test(t)) return addDays(todayStr, 1);
  if(/\btoday\b/.test(t)) return todayStr;

  const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  for(let i=0;i<days.length;i++){
    if(new RegExp('\\b' + days[i] + '\\b').test(t) || new RegExp('\\b' + days[i].slice(0,3) + '\\b').test(t)){
      const curDow = now.getDay();
      let diff = i - curDow;
      if(diff <= 0) diff += 7;
      return addDays(todayStr, diff);
    }
  }

  return null;
}

function extractTimes(t){
  const out = [];
  const re = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to|until)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/gi;
  const m = re.exec(t);
  if(m){
    let [, h1, m1, ap1, h2, m2, ap2] = m;
    let H1 = parseInt(h1,10), M1 = m1 ? parseInt(m1,10) : 0;
    let H2 = parseInt(h2,10), M2 = m2 ? parseInt(m2,10) : 0;
    if(ap1 === 'pm' && H1 < 12) H1 += 12;
    if(ap1 === 'am' && H1 === 12) H1 = 0;
    if(ap2 === 'pm' && H2 < 12) H2 += 12;
    if(ap2 === 'am' && H2 === 12) H2 = 0;
    out.push(String(H1).padStart(2,'0') + ':' + String(M1).padStart(2,'0'));
    out.push(String(H2).padStart(2,'0') + ':' + String(M2).padStart(2,'0'));
  }
  return out;
}

function demoResponder(userText){
  const text = userText.toLowerCase();
  const u = currentUser();
  if(!u) return "You need to be signed in.";
  const emps = visibleEmployees();
  const empIds = new Set(emps.map(e=>e.id));

  if((text.includes('leave') || text.includes('day')) && (text.includes('how many') || text.includes('left') || text.includes('balance'))){
    if(u.role === 'Employee' && u.employeeId){
      const approved = state.leaveRequests.filter(l => l.employeeId === u.employeeId && l.status === 'Approved');
      return `You have ${approved.length} approved leave request${approved.length===1?'':'s'} on file. Leave credits accrue monthly — ask HR for your exact balance.`;
    }
    return `${state.leaveRequests.filter(l => l.status==='Approved' && empIds.has(l.employeeId)).length} approved leave requests are on file for the team.`;
  }
  if(text.includes('next shift') || text.includes('next schedule') || (text.includes('when') && text.includes('shift'))){
    const upcoming = state.shifts.filter(s => empIds.has(s.employeeId) && s.date >= todayISO).sort((a,b) => a.date.localeCompare(b.date))[0];
    if(!upcoming) return "No upcoming shifts are scheduled.";
    return `The next shift is ${fmtDate(upcoming.date)} from ${upcoming.start} to ${upcoming.end} (${upcoming.tour}) for ${empName(upcoming.employeeId)}.`;
  }
  if(text.includes('working today') || (text.includes('who') && text.includes('today')) || text.includes('on shift today')){
    const todayShifts = shiftsOn(todayISO).filter(s => empIds.has(s.employeeId));
    if(!todayShifts.length) return "No one is scheduled to work today.";
    return `Working today: ${todayShifts.map(s => `${empName(s.employeeId)} (${s.start}–${s.end})`).join(', ')}.`;
  }
  if(text.includes('overtime') || text === 'ot'){
    const ts = computeTimesheet(state.weekStart, emps);
    const ot = ts.filter(r => r.overtime > 0);
    if(!ot.length) return "No one is at overtime risk this week.";
    return `Overtime this week: ${ot.map(r => `${r.emp.name} (${r.overtime.toFixed(1)}h)`).join(', ')}.`;
  }
  if(text.includes('summary') || text.includes('how are we') || text.includes('overview')){
    const ts = computeTimesheet(state.weekStart, emps);
    const total = ts.reduce((a,r) => a+r.total, 0);
    const ot = ts.reduce((a,r) => a+r.overtime, 0);
    const late = ts.reduce((a,r) => a+r.lateCount, 0);
    return `This week: ${total.toFixed(1)} hours logged, ${ot.toFixed(1)}h overtime, ${late} late incidents across ${emps.length} employees.`;
  }
  if(text.includes('pending') || (text.includes('leave') && text.includes('request'))){
    const pending = state.leaveRequests.filter(l => empIds.has(l.employeeId) && l.status === 'Pending');
    if(!pending.length) return "No pending leave requests right now.";
    return `${pending.length} pending leave request${pending.length===1?'':'s'}: ${pending.map(l => `${empName(l.employeeId)} (${fmtDate(l.startDate)})`).join(', ')}.`;
  }
  if(text.includes('help') || text.includes('what can you')){
    return "I can answer questions about shifts, attendance, leave, and overtime. Try: \"When's my next shift?\", \"Who's working today?\", or \"Show me this week's summary.\"";
  }
  return "I'm in demo mode right now and can answer questions about shifts, attendance, leave, and overtime. Set an API key from Groq, Gemini, OpenRouter, or Cerebras for full AI responses.\n\nTry: \"When's my next shift?\", \"Who's working today?\", \"Overtime this week?\", or \"Summary\".";
}

function sendChatMessage(text){
  const trimmed = String(text||'').trim();
  if(!trimmed || state.chatBusy) return;
  state.chatMessages.push({ role: 'user', content: trimmed });
  state.chatBusy = true;
  state.chatError = null;
  render();
  scrollAIToBottom();
  const useAPI = !!state.aiKey;

  const run = async () => {
    try{
      let reply;
      if(useAPI){
        reply = await callAI(state.chatMessages.slice(-10));
      } else {
        await new Promise(r => setTimeout(r, 500));
        reply = demoResponder(trimmed);
      }

      let actions = parseActionsFromReply(reply);
      let cleanReply = stripActionsFromReply(reply);

      if(!actions.length){
        const local = parseLocalIntent(trimmed);
        if(local) actions = [local];
      }

      state.chatMessages.push({ role: 'assistant', content: cleanReply || reply });

      for(const act of actions){
        const result = executeAction(act.type, act.params);
        if(result.ok){
          showToast('Action applied', result.message, { tone:'success' });
          state.chatMessages.push({ role: 'assistant', content: '✅ ' + result.message });
        } else {
          state.chatMessages.push({ role: 'assistant', content: '⚠️ ' + result.message });
        }
      }
    }catch(err){
      state.chatError = err.message || 'Something went wrong.';
      state.chatMessages.push({ role: 'assistant', content: "I couldn't reach the AI service." });
    }
    state.chatBusy = false;
    render();
    scrollAIToBottom();
  };
  run();
}
function scrollAIToBottom(){
  setTimeout(() => {
    const el = document.getElementById('ai-messages');
    if(el) el.scrollTop = el.scrollHeight;
  }, 30);
}

/* ============================= SMART SCHEDULING ============================= */
function tourMatchesRole(tour, role){
  const t = (tour||'').toLowerCase();
  const r = (role||'').toLowerCase();
  if(r.includes('guide') && (t.includes('walk') || t.includes('trek') || t.includes('tour') || t.includes('hopping'))) return true;
  if(r.includes('driver') && (t.includes('transfer') || t.includes('van') || t.includes('airport'))) return true;
  if(r.includes('desk') && (t.includes('desk') || t.includes('bookings') || t.includes('front'))) return true;
  return false;
}
function weeklyHoursForEmployee(empId, weekStart){
  const dates = weekDates(weekStart);
  let hours = 0;
  dates.forEach(d => {
    state.shifts.filter(s => s.employeeId === empId && s.date === d).forEach(s => {
      hours += hoursBetween(s.start, s.end);
    });
  });
  return hours;
}
function countShiftsWithTour(empId, tour){
  const t = (tour||'').toLowerCase().trim();
  if(!t) return 0;
  return state.shifts.filter(s => s.employeeId === empId && (s.tour||'').toLowerCase().includes(t)).length;
}
function countShiftsOnDayOfWeek(empId, iso){
  const dow = new Date(iso + 'T00:00:00').getDay();
  return state.shifts.filter(s => s.employeeId === empId && new Date(s.date + 'T00:00:00').getDay() === dow).length;
}
function scoreCandidates(date, tour, durationHours){
  const emps = visibleEmployees();
  const results = [];
  for(const emp of emps){
    if(isOnApprovedLeave(emp.id, date)) continue;
    if(state.shifts.some(s => s.employeeId === emp.id && s.date === date)) continue;
    const weeklyHours = weeklyHoursForEmployee(emp.id, state.weekStart);
    const fairness = Math.max(0, 40 - weeklyHours);
    const roleBonus = tourMatchesRole(tour, emp.role) ? 20 : 6;
    const history = Math.min(15, countShiftsWithTour(emp.id, tour) * 5);
    const consistency = Math.min(10, countShiftsOnDayOfWeek(emp.id, date) * 2);
    const total = Math.round(fairness + roleBonus + history + consistency);
    const reasons = [];
    if(weeklyHours < 20) reasons.push({ label: weeklyHours < 8 ? 'Light week' : 'Under 20h', good: true });
    else if(weeklyHours >= 40) reasons.push({ label: 'At 40h', good: false });
    if(tourMatchesRole(tour, emp.role)) reasons.push({ label: 'Role match', good: true });
    if(countShiftsWithTour(emp.id, tour) > 0) reasons.push({ label: 'Has run this tour', good: true });
    if(countShiftsOnDayOfWeek(emp.id, date) >= 2) reasons.push({ label: 'Usual day', good: true });
    results.push({ emp, score: total, reasons, weeklyHours });
  }
  results.sort((a,b) => b.score - a.score);
  return results.slice(0, 5);
}

let otpTicker = null;
function stopOTPTicker(){ if(otpTicker){ clearInterval(otpTicker); otpTicker = null; } }
function startOTPTicker(){
  stopOTPTicker();
  const update = ()=>{
    const el = document.getElementById('otp-countdown');
    if(!el){ stopOTPTicker(); return; }
    el.textContent = 30 - (Math.floor(Date.now() / 1000) % 30);
  };
  update();
  otpTicker = setInterval(update, 1000);
}

let lockTicker = null;
function stopLockTicker(){ if(lockTicker){ clearInterval(lockTicker); lockTicker = null; } }
function startLockTicker(){
  stopLockTicker();
  const tick = () => {
    if(!state.loginError || !state.loginError.lockedUntil){ stopLockTicker(); return; }
    const total = AUTH_LOCK_MS / 1000;
    const remaining = Math.max(0, Math.ceil((state.loginError.lockedUntil - Date.now())/1000));
    const el = document.getElementById('lock-countdown');
    if(el){ const next = String(remaining); if(el.textContent !== next) el.textContent = next; }
    const bar = document.getElementById('lock-progress');
    if(bar){ const pct = Math.min(100, Math.max(0, ((total - remaining)/total) * 100)); bar.style.width = pct + '%'; }
    if(remaining <= 0){
      stopLockTicker();
      clearLoginFailureState();
      state.loginError = null;
      state.loginBusy = false;
      render();
    }
  };
  tick();
  lockTicker = setInterval(tick, 200);
}

function render(){
  state.openAttKey = null;
  stopOTPTicker();
  stopLockTicker();
  const app = document.getElementById('app');
  if(!state.authReady){
    app.innerHTML = `<div class="login-screen"><div style="color:#94A3B8;font-family:'Poppins',sans-serif;font-size:13px;">Preparing secure sign-in…</div></div>`;
    return;
  }
  if(state.otpStage){
    app.innerHTML = renderOTPScreen();
    attachOTPHandlers();
    startOTPTicker();
    return;
  }
  if(!state.session){
    // Restore the page-wide lockout after a reload, including failures for
    // usernames that do not match an account.
    const savedFailures = readLoginFailureState();
    const activeLock = savedFailures.lockedUntil ? {lockedUntil:savedFailures.lockedUntil} : state.users.find(u=>u.active && u.lockedUntil && u.lockedUntil>Date.now());
    if(activeLock && (!state.loginError || !state.loginError.lockedUntil)){
      state.loginError = {message:'Too many failed attempts. Please wait before trying again.', locked:true, lockedUntil:activeLock.lockedUntil};
    }
    app.innerHTML = renderLogin();
    attachLoginHandlers();
    if(state.loginError && state.loginError.lockedUntil) startLockTicker();
    return;
  }
  const cu = currentUser();
  if(cu && cu.mustChangePassword) state.view = 'account';
  app.innerHTML = renderRail() + '<div class="main">' + renderView() + '</div>' + renderAIAssistant() + renderAddShiftModal();
  attachHandlers();
  if(state.users.length > 0) persistState();
}

function renderLogin(){
  const lockedError = state.loginError && state.loginError.lockedUntil ? state.loginError : null;
  const total = AUTH_LOCK_MS / 1000;
  const remaining = lockedError ? Math.max(0, Math.ceil((lockedError.lockedUntil - Date.now())/1000)) : 0;
  const pct = lockedError ? Math.min(100, Math.max(0, ((total - remaining)/total) * 100)) : 0;

  return `
